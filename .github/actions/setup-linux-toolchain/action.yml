name: Set up the Linux toolchain
description: >-
  Install what culebra builds with on an Ubuntu runner, and export the compiler
  and LLVM paths. Every Linux job in ci.yml and release.yml starts here, so a
  toolchain bump is one edit rather than five — and the five cannot drift into
  building against different compilers without anyone noticing.

inputs:
  sdl3-deps:
    description: >-
      Install SDL3's build dependencies, so CMake leaves the Canvas desktop
      window at its Linux default (ON). SDL3's configure hard-errors on a
      missing one rather than dropping that backend, so a job that wants the
      window and omits these silently builds the very thing it exists to test
      out of the build. They are build-time only: SDL3 dlopens X11/GL/audio on
      first use, so the binary gains no DT_NEEDED entry and still starts on a
      headless machine. Tracks vendor/SDL/docs/README-linux.md.
    default: 'false'
  webview-deps:
    description: >-
      Install the WebView engine's headers, so CMake leaves the Webview
      namespace at its Linux default (ON). Headers only, by design: the binding
      dlopens the engine when a window is created
      (src/runtime/webview_gtk_dynload.cc), so the binary carries Webview
      without needing gtk4 or webkitgtk present to start.
    default: 'false'
  extra-packages:
    description: >-
      Anything a single job needs and the project does not — xvfb for the jobs
      that open a window, and nothing else so far. Space-separated.
    default: ''

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      env:
        SDL3_DEPS: ${{ inputs.sdl3-deps }}
        WEBVIEW_DEPS: ${{ inputs.webview-deps }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        # gcc-14: Ubuntu 24.04 ships gcc-13 by default, which lacks C++23
        # <print>. lsb-release/software-properties-common/gnupg are what
        # apt.llvm.org's installer needs below.
        pkgs=(ccache cmake g++-14 libblas-dev mold wget
              lsb-release software-properties-common gnupg)
        if [ "$SDL3_DEPS" = true ]; then
          pkgs+=(libasound2-dev libpulse-dev libaudio-dev libfribidi-dev
                 libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev
                 libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
                 libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
                 libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev
                 libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
                 libpipewire-0.3-dev libwayland-dev libdecor-0-dev
                 liburing-dev)
        fi
        if [ "$WEBVIEW_DEPS" = true ]; then
          pkgs+=(libgtk-4-dev libwebkitgtk-6.0-dev)
        fi
        # Deliberately unquoted: the input is a space-separated package list.
        # shellcheck disable=SC2206
        pkgs+=($EXTRA_PACKAGES)
        sudo apt-get update
        sudo apt-get install -y "${pkgs[@]}"

    - name: Install just
      uses: ./.github/actions/install-just

    - name: Install LLVM 22
      shell: bash
      run: |
        # Ubuntu 24.04's default llvm-dev (17/18) is too old — culebra's JIT
        # uses LLVM 20+ APIs. Pull LLVM 22 from apt.llvm.org to match the local
        # dev environment (README references LLVM 22).
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 22
        sudo apt-get install -y llvm-22-dev

    - name: Export compiler and LLVM paths
      shell: bash
      run: |
        {
          echo "CC=gcc-14"
          echo "CXX=g++-14"
          echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-22"
        } >> "$GITHUB_ENV"
