name: Download the built culebra
description: >-
  Fetch the driver build-ubuntu uploaded and make it executable. Every Ubuntu
  job that `needs: build-ubuntu` runs against that artifact rather than
  building, and each of them then spells `./build/culebra` — so the name and
  the path are fixed here rather than passed in.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: culebra-ubuntu-latest
        path: build

    # Artifacts drop file modes.
    - shell: bash
      run: chmod +x build/culebra
