# The deps cache (CULEBRA_DEPS_CACHE: the vendored SDL3, raylib and llama.cpp
# statics). CMake names each statics directory and lists the names a configure
# uses in <build dir>/deps-cache-dirs.txt; the key is that list's cksum, so CMake
# is the only place a key is spelled. Restore (before configure, which decides
# whether to build) takes the newest save under the prefix; save prunes what
# CMake no longer names and is skipped when the key is the one restored.
name: deps cache
description: Restore or save the vendored statics, keyed on what CMake names
inputs:
  prefix:
    description: Cache key prefix; jobs that build the same statics share one
    required: true
  step:
    description: restore (before configure) or save (after the build)
    required: true
  build-dir:
    description: The build directory holding deps-cache-dirs.txt (save only)
    required: false
    default: build
  path:
    description: The deps cache directory (default $CULEBRA_DEPS_CACHE)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - if: inputs.step == 'restore'
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path || env.CULEBRA_DEPS_CACHE }}
        key: ${{ inputs.prefix }}-
        restore-keys: ${{ inputs.prefix }}-

    - if: inputs.step == 'restore'
      shell: bash
      run: echo "${{ steps.restore.outputs.cache-matched-key }}" > "$RUNNER_TEMP/deps-cache-${{ inputs.prefix }}.key"

    - if: inputs.step == 'save'
      id: key
      shell: bash
      run: |
        list="${{ inputs.build-dir }}/deps-cache-dirs.txt"
        [ -s "$list" ] || { echo "deps cache: no $list, nothing to save"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
        dirs=$(sort -u "$list")
        key="${{ inputs.prefix }}-$(printf '%s\n' "$dirs" | cksum | cut -d' ' -f1)"
        restored=$(cat "$RUNNER_TEMP/deps-cache-${{ inputs.prefix }}.key" 2>/dev/null || true)
        root="${{ inputs.path || env.CULEBRA_DEPS_CACHE }}"
        command -v cygpath > /dev/null && root=$(cygpath -u "$root")  # Windows: a D:\ path
        for d in "$root"/*; do
          [ -e "$d" ] || continue
          grep -qxF "$(basename "$d")" <<<"$dirs" || { echo "deps cache: pruning $(basename "$d")"; rm -rf "$d"; }
        done
        echo "key=$key" >> "$GITHUB_OUTPUT"
        if [ "$key" = "$restored" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

    - if: inputs.step == 'save' && steps.key.outputs.skip == '0'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path || env.CULEBRA_DEPS_CACHE }}
        key: ${{ steps.key.outputs.key }}
