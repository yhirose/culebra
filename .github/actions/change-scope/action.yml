# How far this change reaches (tools/checks/change_scopes.txt, read by
# misc/change_scope.sh, as `just land` reads it): none, light or full. The job
# must have checked out those two files and this action. Anything this cannot
# tell (a schedule, a manual run, a compare it cannot fetch or one of 300
# files or more) is `full`. A push to master is compared with the commit
# before it (master's runs are never cancelled); any other push with master,
# because a newer push to the same branch cancels the older run, which must
# not leave its changes checked only lightly.
name: change scope
description: Classify the files this run's change touches by change_scopes.txt
inputs:
  token:
    description: A token that can read the repository's compare API
    required: true
outputs:
  scope:
    description: none, light or full
    value: ${{ steps.scope.outputs.scope }}
runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        case "$EVENT" in
          push)
            if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then base=$PUSH_BEFORE
            else base=$DEFAULT_BRANCH; fi
            head=$GITHUB_SHA ;;
          pull_request) base=$PR_BASE head=$PR_HEAD ;;
          *)            base= head= ;;
        esac
        scope=full
        # A renamed file counts at the path it left too (previous_filename).
        if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] &&
           files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$head" \
                     --jq '.files[] | .filename, (.previous_filename // empty)') &&
           [ "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -lt 300 ]; then
          scope=$(printf '%s\n' "$files" | misc/change_scope.sh)
        fi
        echo "change scope: $scope"
        echo "scope=$scope" >> "$GITHUB_OUTPUT"
