name: Bump winget manifest

# Fires when a release moves out of draft — same trigger as
# homebrew-bump.yml, and for the same reason (release.yml's asset-build
# jobs have already produced culebra-windows-x64.zip by then).
#
# Unlike homebrew-bump.yml this does NOT push directly: winget-pkgs is
# microsoft/winget-pkgs, a repo we don't own, so every update lands as a
# PR reviewed by winget-pkgs' own (largely automated) validation — no
# guarantee of immediate, or same-day, merge.
#
# vedantmgoyal9/winget-releaser only bumps an EXISTING manifest (it
# regenerates from the last published version's manifest plus the new
# installer, it does not author one from scratch). The first
# yhirose.culebra manifest has to exist in winget-pkgs before this
# workflow can do anything; it was authored by hand and submitted
# out-of-band, not generated by this job. If yhirose.culebra ever needs
# re-seeding (e.g. winget-pkgs deletes stale versions), redo that by hand
# before re-enabling this workflow.
#
# WINGET_TOKEN must be a classic PAT (fine-grained PATs aren't supported
# by this action) with the public_repo scope, from an account that has
# forked microsoft/winget-pkgs — see the action's README for the fork
# step. Default fork-user is the repo owner (yhirose), which matches.
#
# WINGET_TOKEN's public_repo scope reaches every public repo the account
# can write to, not just winget-pkgs, so pinned to a commit rather than
# the mutable v2 tag: a compromised or malicious update to the action
# would otherwise run with that token on the next release, unreviewed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: yhirose.culebra
          installers-regex: 'culebra-windows-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
