name: Benchmarks

# Numbers from shared CI runners are noisy (especially Ubuntu).
# Treat output as a "does it run, roughly how fast" sanity check —
# not a regression detector.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 00:00 UTC.
    - cron: '0 0 * * 0'

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No display on a runner, and the benchmarks never open a window: keep the
      # macOS and Linux default off so the job skips the vendored SDL3 + raylib
      # build (which on Linux would also need SDL3's dev packages installed).
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # lua5.4 and guile-3.0 are `just bench-langs`' only apt-installable
          # comparison runtimes; python3, ruby, node and go come with the
          # image and dotnet comes from setup-dotnet below.
          sudo apt-get install -y \
            cmake \
            g++-14 \
            libblas-dev \
            wget \
            lsb-release \
            software-properties-common \
            gnupg \
            lua5.4 \
            guile-3.0
          # Ubuntu 24.04's apt-shipped `just` predates the [group(...)]
          # attribute (just 1.27.0+). Install from the official script.
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
          # Ubuntu 24.04's default llvm-dev (17/18) is too old — culebra's
          # JIT uses LLVM 20+ APIs. Pull LLVM 22 from apt.llvm.org to
          # match the local dev environment (README references LLVM 22).
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          # Ubuntu 24.04 ships gcc-13 by default, which lacks C++23 <print>.
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
            echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-22"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llvm just lua guile

      # `just bench-langs`' C# lane. Neither runner image is guaranteed to
      # carry an SDK, and a missing one would quietly report "-".
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release + JIT)
        run: just build

      - name: Run perf
        run: |
          set -o pipefail
          just perf | tee bench.txt
          {
            echo "## Benchmark results — ${{ matrix.os }}"
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run language comparison
        run: |
          set -o pipefail
          just bench-langs | tee langs.txt
          {
            echo "## Language comparison — ${{ matrix.os }}"
            echo
            echo '```'
            cat langs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
