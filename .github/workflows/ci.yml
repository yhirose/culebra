name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly build on master to keep the per-OS ccache warm. GitHub evicts a
  # cache after 7 days without access; this repo's local-first workflow can go
  # long stretches without a CI push, and a cold cache makes the macOS build
  # ~10x slower (it swaps — see `build_jobs` below). PR/push cache restores also
  # refresh the 7-day timer, so this is just the backstop for quiet weeks.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # mold (Rui Ueyama's modern linker, ~2-3x faster than lld on
            # Linux) for the LLVM-heavy static link step. macOS already
            # uses Apple's ld-prime (Xcode 15+) by default — fast enough,
            # no override needed.
            linker_flag: -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
            # build_jobs empty = all cores (16 GB Ubuntu has headroom for the
            # ~3 GB-per-TU parallel compile). Ubuntu runs the full test suite.
            build_jobs: ""
            skip_heavy: ""
          - os: macos-latest
            linker_flag: ""
            # The 7 GB macOS runner swaps when compiling >2 LLVM-header-heavy
            # TUs (~3 GB each) at once — cap the build to 2 (cuts ~64 min → ~18).
            build_jobs: "2"
            # The test suite's two heavy phases (the 5114-case difftest + the
            # per-test AOT links) are platform-independent and run on Ubuntu CI
            # and in local dev; the slow 3-core macOS runner takes ~30 min on
            # them for no extra coverage, so skip them here. macOS still does
            # the clean-env build + interp/JIT symmetry + ctest + isolate +
            # microgpt smoke.
            skip_heavy: "1"
    runs-on: ${{ matrix.os }}
    env:
      # `just build`'s `make -j${CULEBRA_BUILD_JOBS:-<ncpu>}` honors this.
      CULEBRA_BUILD_JOBS: ${{ matrix.build_jobs }}
      # `just test` skips difftest + AOT when this is non-empty.
      CULEBRA_TEST_SKIP_HEAVY: ${{ matrix.skip_heavy }}
      # ccache as the compiler launcher via env (job-wide) — not just the build
      # step's -D flags — so EVERY cmake configure agrees, including the
      # `just build` prereq that `just test` / `just smoke-microgpt` re-run.
      # With only the -D flags, that reconfigure dropped the launcher, changed
      # every compile command, and recompiled everything WITHOUT ccache
      # (~12 min) inside the test step.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            g++-14 \
            libblas-dev \
            mold \
            wget \
            lsb-release \
            software-properties-common \
            gnupg
          # Ubuntu 24.04's apt-shipped `just` predates the [group(...)]
          # attribute (just 1.27.0+). Install from the official script.
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
          # Ubuntu 24.04's default llvm-dev (17/18) is too old — culebra's
          # JIT uses LLVM 20+ APIs. Pull LLVM 22 from apt.llvm.org to
          # match the local dev environment (README references LLVM 22).
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          # Ubuntu 24.04 ships gcc-13 by default, which lacks C++23 <print>.
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
            echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-22"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # coreutils provides `gtimeout` — `just test` uses it to bound each
          # test so a frozen macOS VM fails the phase fast instead of hanging
          # the job (macOS has no native `timeout`). Ubuntu's is built in.
          brew install llvm just ccache coreutils

      # Compiler cache for incremental CI builds. Without it every PR
      # push re-compiles culebra from scratch (~4 min macOS / 7 min
      # Ubuntu, dominated by LLVM-header-heavy interpreter.h + jit.h
      # translation units). LLVM static link itself is not cached.
      # CCACHE_DIR is pinned under the workspace so the path is
      # identical between actions/cache and ccache itself (brew
      # ccache defaults to ~/Library/Caches/ccache on macOS otherwise).
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Check grammar sync (misc/culebra.peg and misc/cul.vim)
        run: just check-grammar-sync

      - name: Check stdlib preambles sync (src/preambles -> gen.h)
        run: just check-preambles

      - name: Build (interpreter + JIT)
        run: just build ${{ matrix.linker_flag }}

      # Interpreter-only build gate (CULEBRA_ENABLE_JIT=OFF). The `culebra`
      # driver is the one TU with #ifdef CULEBRA_JIT_ENABLED gating, so a
      # mismatched guard there breaks the no-JIT build while the default
      # JIT build stays green. Ubuntu-only — the breakage is compiler/define
      # driven, not platform-specific, and the slow macOS runner needn't pay
      # for a second from-scratch compile (the JIT define flips every ccache
      # key, so this shares nothing with the build above).
      - name: Build (interpreter only, no JIT)
        if: matrix.os == 'ubuntu-latest'
        run: just build-no-jit

      - name: Report ccache stats
        run: ccache -s

      - name: Test (interp/JIT diff + embedding smoke + AOT + culebra-test self)
        # Reuse the LTO build/ from the Build step rather than letting `just
        # test` spin up a second no-LTO build-gate/. CI already pays for the
        # ThinLTO link in the Build step above, so run the full gate against it
        # — this also keeps the gate exercising the LTO binary on both OSes.
        # (Local dev gets the fast no-LTO gate via plain `just test`.)
        run: BIN=./build/culebra just _run-tests all

      # Run the ```culebra examples in docs/ (interp only). Invoke the
      # binary directly rather than `just doctest` so it reuses the build
      # above instead of re-running `just build` without the ccache flags.
      - name: Doctest (docs examples, interp)
        run: ./build/culebra test --doc tests/doctest docs

      - name: Smoke test microgpt (5 steps, both backends)
        run: just smoke-microgpt

  # Windows port — Phase 1. Builds the interpreter-only driver (no JIT/AOT) with
  # the OS-heavy optional features off, to prove the core language + stdlib +
  # SQLite compile and run on Windows. The subprocess (Proc), terminal raw-mode
  # (Term) and cross-process SharedBuffer subsystems are stubbed on Windows (they
  # raise a clear "not supported" error) and land in later phases; everything
  # else — interp, FS, string/collection/number stdlib, in-process SharedBuffer —
  # runs. Kept a separate job from the JIT/AOT matrix above, whose `just build`
  # / `just test` steps assume the full LLVM toolchain.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25  # a runtime hang (e.g. a Proc deadlock) fails fast here
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mingw-w64 (GCC 14+ / libstdc++) rather than MSVC: the codebase's central
      # recursive Value type is used through std::vector<Value> while still
      # incomplete, which libstdc++ (as on Linux/macOS) accepts but the MSVC STL
      # rejects. mingw keeps the Linux STL behaviour, so the core compiles with
      # no changes. The binary is linked fully static (-static: libstdc++ /
      # libgcc / libwinpthread), so it runs on a plain Windows box with no mingw
      # runtime DLLs — verified below.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      - name: Configure (interpreter only, static, Phase 1 feature set)
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCULEBRA_ENABLE_JIT=OFF \
            -DCULEBRA_ENABLE_HTTP=OFF \
            -DCULEBRA_ENABLE_GRAPHICS=OFF \
            -DCULEBRA_ENABLE_WEBVIEW=OFF \
            -DCULEBRA_DEV_NO_RT=ON \
            -DCULEBRA_LTO=OFF

      # `-k 0` keeps building after the first error so a CI run surfaces the full
      # set of Windows-portability breakages at once instead of one per push.
      - name: Build (culebra driver)
        run: cmake --build build-win --target culebra -j -- -k 0

      # Prove the "runs on a plain Windows box" claim: the .exe may import ONLY
      # DLLs that ship with every Windows install. Anything else (mingw runtime
      # libstdc++-6 / libgcc_s / libwinpthread, or a bundled zlib1.dll) would
      # make it fail to start on a clean machine. Whitelist the system DLLs and
      # fail on any other import.
      - name: Verify standalone binary (only system DLLs)
        run: |
          echo "Imported DLLs:"
          imports=$(objdump -p build-win/culebra.exe \
            | grep -i 'DLL Name' | sed -E 's/.*DLL Name:\s*//' | tr 'A-Z' 'a-z' | sort -u)
          echo "$imports"
          allow='^(kernel32|kernelbase|msvcrt|ntdll|user32|advapi32|ws2_32|shell32|ole32|oleaut32|bcrypt|crypt32|secur32|iphlpapi|dbghelp|version|winmm|gdi32)\.dll$'
          bad=$(echo "$imports" | grep -viE "$allow" || true)
          if [ -n "$bad" ]; then
            echo "ERROR: binary imports non-system DLL(s) — not standalone:"
            echo "$bad"
            exit 1
          fi
          echo "OK: only system DLLs imported — runs on a plain Windows box"

      - name: Smoke test (interp runs a script + core stdlib)
        run: |
          cat > smoke.cul <<'EOF'
          fn check(cond, msg) { if !cond { throw "check failed: " + msg } }
          # Progress markers go to stderr (unbuffered) so if a Proc call ever
          # deadlocks, the last marker printed pinpoints which one.
          fn step(msg) { IO.eputs("[smoke] " + msg) }
          print("hello from culebra on windows")
          let xs = [3, 1, 2].sorted_by(fn(x) { x })
          check(xs.join(",") == "1,2,3", "sort")
          check("UPPER".lower() == "upper" && "abc".upper() == "ABC", "case")
          let o = {"a": 1, "b": 2}
          check(o.keys().sorted_by(fn(k) { k }).join(",") == "a,b", "keys")

          # Phase 2: Proc runs real subprocesses via CreateProcess/CreatePipe.
          step("before Proc.run echo")
          let r = Proc.run(["cmd", "/c", "echo hi"])
          step("after Proc.run echo")
          check(r.ok && r.code == 0, "Proc.run exit code")
          check(r.stdout.contains("hi"), "Proc.run stdout capture")
          # Non-zero exit is reported, not raised.
          step("before Proc.run exit3")
          let bad = Proc.run(["cmd", "/c", "exit 3"])
          step("after Proc.run exit3")
          check(!bad.ok && bad.code == 3, "Proc.run non-zero exit")
          # stdin is fed to the child (findstr echoes lines matching the pattern).
          step("before Proc.run findstr(stdin)")
          let f = Proc.run(["findstr", "x"], stdin: "x marks\nno match\n")
          step("after Proc.run findstr(stdin)")
          check(f.stdout.contains("x marks") && !f.stdout.contains("no match"),
                "Proc.run stdin feed")
          # allSettled batch across two commands, results in input order.
          step("before Proc.all")
          let batch = Proc.all([["cmd", "/c", "echo one"], ["cmd", "/c", "echo two"]])
          step("after Proc.all")
          check(batch[0].stdout.contains("one") && batch[1].stdout.contains("two"),
                "Proc.all batch order")
          # Live handle: spawn, then wait for the reaped result.
          step("before Proc.spawn")
          let h = Proc.spawn(["cmd", "/c", "echo spawned"])
          step("after Proc.spawn, before wait")
          let hr = h.wait()
          step("after Proc.spawn wait")
          check(hr.stdout.contains("spawned"), "Proc.spawn + wait")

          # Phase 2: Term primitives are callable off-tty (raw mode no-ops, size
          # falls back / queries the console, width is pure).
          step("before Term")
          check(Term.cols() > 0 && Term.rows() > 0, "Term size")
          check(Term.width("abc") == 3, "Term display width")
          step("after Term")

          print("smoke ok")
          EOF
          # Bound the run so a deadlock fails the step in ~90s (exit 124) with the
          # last [smoke] marker on stderr, instead of hanging the whole job.
          # CULEBRA_PROC_TRACE surfaces where inside the Proc machinery it hangs.
          CULEBRA_PROC_TRACE=1 timeout 90 ./build-win/culebra.exe smoke.cul
