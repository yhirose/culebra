name: CI

on:
  push:
    # master, plus any `ci/**` branch: this repo's local-first, multi-worktree
    # workflow lands most work by local-master ff (no PR), so pushing a branch
    # named `ci/<topic>` runs the full matrix on it WITHOUT opening a throwaway
    # PR just to trigger CI. Feature branches don't auto-run (avoids CI spend on
    # every push across the concurrent worktrees); opt in by the `ci/` prefix.
    branches: [master, 'ci/**']
  pull_request:
  # Manual trigger for any branch (no PR, no rename needed):
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:
  # Weekly build on master to keep the per-OS ccache warm. GitHub evicts a
  # cache after 7 days without access; this repo's local-first workflow can go
  # long stretches without a CI push, and a cold cache makes the macOS build
  # ~10x slower (it swaps — see `build_jobs` below). PR/push cache restores also
  # refresh the 7-day timer, so this is just the backstop for quiet weeks.
  schedule:
    - cron: '0 4 * * 1'

# Coalesce runs per ref: a new push to the same branch cancels its still-running
# CI (a branch + its PR would otherwise double-run, and rapid re-pushes pile up).
# master is exempt — every landed commit keeps its own gate result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Every step that launches culebra must name the engine it means. A bare
# launch measures whatever the default happens to be, and the default has
# moved once already (docs/internals/vm.md §2) — silently, for anything
# that had not said. With this set an implicit pick aborts instead; `--jit` /
# `--vm` name the engines. The justfile sets
# the same variable for its recipes: this covers the steps that invoke the
# binary directly. The one lane that must NOT set it is the one that measures
# the default itself (tests/cli_input_test.sh).
env:
  CULEBRA_REQUIRE_EXPLICIT_ENGINE: "1"

jobs:
  # Ubuntu used to be one job (build + `_run-tests all`), and on the 4-core
  # standard runner that serialized ~24 min of test phases behind the build,
  # making it the workflow's ~34 min critical path. It is now this build job
  # plus the parallel test-ubuntu lanes below: most test phases need only the
  # built binary, so they fan out across free ubuntu-latest jobs instead of
  # queueing behind each other. This job builds, uploads the binary the lanes
  # download, and runs the phases that need the CMake build tree itself
  # (`_run-tests ci-buildtree`).
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Linux defaults the Canvas desktop window ON; a runner has no display,
      # building the vendored SDL3 + raylib statics would add ~4 min, and the
      # runner does not install SDL3's build dependencies (whose absence fails
      # its configure outright).
      # Job-wide env, not a -D on the build step, so every cmake configure
      # agrees — including the `just build` prereq `just smoke-microgpt`
      # re-runs.
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
      # ccache as the compiler launcher via env (job-wide) — not just the build
      # step's -D flags — so EVERY cmake configure agrees, including the
      # `just build` prereq that `just smoke-microgpt` re-runs.
      # With only the -D flags, that reconfigure dropped the launcher, changed
      # every compile command, and recompiled everything WITHOUT ccache
      # (~12 min) inside the test step.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # No windowed dependencies: this job pins the Canvas window off, and
      # without gtk4/webkitgtk the Webview namespace self-disables — which is
      # also the coverage this lane provides, that the tree still builds and
      # passes with both windowed axes absent.
      - name: Install dependencies
        uses: ./.github/actions/setup-linux-toolchain

      # Compiler cache for incremental CI builds. Without it every PR
      # push re-compiles culebra from scratch (~7 min, dominated by
      # LLVM-header-heavy jit.h translation units). LLVM
      # static link itself is not cached. CCACHE_DIR is pinned under the
      # workspace so the path is identical between actions/cache and
      # ccache itself.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Check grammar sync (misc/culebra.peg and misc/culebra.vim)
        run: just check-grammar-sync

      - name: Check stdlib preambles sync (src/preambles -> gen.h)
        run: just check-preambles

      # A stale blob still runs correctly, it just falls back to load_grammar()
      # and costs ~10 ms on every startup — no other gate can see that.
      - name: Check grammar blob sync (grammar_def.h -> grammar_blob.gen.h)
        run: just check-blob

      # Regenerating the served page needs emsdk, which no runner has, so a
      # version bump can land with it still naming the old version.
      - name: Check Playground version sync (culebra.h -> site/playground)
        run: just check-site-version

      # vendor/cpp-vmlib is a submodule: a bump can hand scripts a new IR
      # vocabulary member with nothing documenting it, or a new Tag with no
      # builder and no reader at all. Needs no build, so it runs here with the
      # rest of check-generated's members -- check-generated itself is not run
      # as a unit anywhere in CI (the test jobs below call `just _run-tests`
      # directly), so this is the only place this specific member is checked.
      - name: Check CodeGen IR vocabulary coverage (vmlib.h -> CodeGen)
        run: just check-codegen-enums

      # mold (Rui Ueyama's modern linker, ~2-3x faster than lld on Linux) for
      # the LLVM-heavy static link step.
      - name: Build (interpreter + JIT)
        run: just build -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold

      # Two consumers: the test-ubuntu lanes below download it to run against,
      # and it's a binary to try on a real desktop, which no CI job can stand
      # in for (a runner proves a window does not hang or crash, never that
      # anyone can see it). Right after the build, so a test failure below
      # still leaves it behind. Note it carries Canvas headless (the job pins
      # CULEBRA_CANVAS_WINDOW_DEFAULT off) and no Webview (no gtk4/webkitgtk
      # here) — the Windows artifact is the only one with a window backend.
      - name: Upload the binary for the test lanes and manual testing
        uses: actions/upload-artifact@v4
        with:
          name: culebra-ubuntu-latest
          path: build/culebra
          retention-days: 1
          compression-level: 1  # ~5x faster than the default, 12% larger

      - name: Report ccache stats
        run: ccache -s

      # Only the phases that need this job's build tree (runtime archives,
      # driver objects, ctest executables) plus the source-only ratchets;
      # everything else runs in the test-ubuntu lanes.
      - name: Test (build-tree phases - ratchets + rt archives + ctest)
        run: BIN=./build/culebra just _run-tests ci-buildtree

      # Run the ```culebra examples in docs/ on both compiled lanes. Invoke the
      # binary directly rather than `just doctest` so it reuses the build
      # above instead of re-running `just build` without the ccache flags.
      - name: Doctest (docs examples, VM + JIT)
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          ./build/culebra test --doc --vm --jobs "$jobs" tests/doctest docs
          ./build/culebra test --doc --jit --jobs "$jobs" tests/doctest docs

      # The other half of the docs: the ```cpp blocks a host author copies.
      # `test --doc` reads ```culebra fences only, and the step above calls the
      # binary rather than `just doctest`, so the recipe's own dependency on
      # this would never run here — name it explicitly.
      - name: Doctest (embedding examples compile)
        run: just check-docs-cpp

      # docs/quick-guide.md's signature index is generated from language.md
      # and stdlib.md; fail if a reference edit landed without regenerating
      # it.
      - name: Check the generated signature index (docs/quick-guide.md)
        run: ./build/culebra --vm misc/gen_quick_guide.cul --check

      - name: Smoke test microgpt (5 steps, both backends)
        run: just smoke-microgpt

  # The heavy test phases, fanned out one lane per free ubuntu-latest job.
  # Every lane needs only the binary build-ubuntu uploaded (LLVM is statically
  # linked into it) plus the checkout; the aot and wrap lanes additionally
  # compile and link, so they install the toolchain, and wrap reuses
  # build-ubuntu's ccache. The lane groups live in justfile's `_run-tests`
  # (ci-light/ci-diff/ci-leak); their union with the aot and wrap lanes and
  # build-ubuntu's ci-buildtree equals what `_run-tests all` runs locally
  # (with the wrap lane opted in).
  test-ubuntu:
    name: test-ubuntu (${{ matrix.lane }})
    needs: build-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One lane failing must not cancel the others' results.
      fail-fast: false
      matrix:
        include:
          # jit host symbols + vm/JIT symmetry + codegen backends +
          # leak-abort smoke + culebra-test self + isolate
          - lane: ci-light
          # generated difftest corpus + the corpus RC-leak regression gate
          - lane: ci-diff
          # corpus inflated-RC audit + jit gc-stress + rc-leak battery
          - lane: ci-leak
          # per-test AOT builds: `culebra build` shells out to the stock
          # `cc`/`c++` (never $CC/$CXX or LLVM tools — LLVM is statically
          # linked into the binary), so the preinstalled runner compiler is
          # all this lane needs.
          - lane: aot
          # wrap rebuilds the whole tree through cmake: toolchain + ccache
          - lane: wrap
            toolchain: "1"
            ccache: "1"
    env:
      # The wrap rebuild must configure exactly like build-ubuntu's Build step
      # (LTO on, Canvas window off, ccache launcher) or its ccache restore
      # misses on every TU (see wrap_test.sh on CULEBRA_WRAP_LTO). Harmless
      # for the other lanes, which never run cmake.
      CULEBRA_WRAP_LTO: "1"
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          # Only wrap's cmake rebuild reads vendor/; every other lane runs the
          # downloaded binary against tests/ + tools/, which reference nothing
          # under vendor/.
          submodules: ${{ matrix.lane == 'wrap' && 'recursive' || 'false' }}

      - name: Install toolchain
        if: matrix.toolchain
        uses: ./.github/actions/setup-linux-toolchain

      # The binary-only lanes skip the toolchain install but still drive
      # their phases through `just _run-tests`.
      - name: Install just
        if: ${{ !matrix.toolchain }}
        uses: ./.github/actions/install-just

      # actions/cache/restore, not actions/cache: build-ubuntu owns the save,
      # and wrap's rebuild is a pure consumer (same tree, same flags — near
      # 100% hits against the cache the Build step just populated).
      - name: Restore ccache
        if: matrix.ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Download the built culebra
        uses: actions/download-artifact@v4
        with:
          name: culebra-ubuntu-latest
          path: build

      # Artifacts drop file modes.
      - name: Restore the exec bit
        run: chmod +x build/culebra

      - name: Test (${{ matrix.lane }})
        run: BIN=./build/culebra just _run-tests ${{ matrix.lane }}

  # No-LLVM gate (CULEBRA_ENABLE_JIT=OFF). The `culebra` driver is the one TU
  # with #ifdef CULEBRA_JIT_ENABLED gating, so a mismatched guard there breaks
  # this build while the default JIT build stays green. It runs as well as
  # builds: only executing a program on the bytecode VM's executor proves the
  # VM stayed out of the LLVM guard. Ubuntu-only — the breakage is
  # compiler/define driven, not platform-specific. Its own job with its own
  # ccache key: the JIT define flips every ccache key, so this build shares
  # nothing with build-ubuntu's cache and would only churn it from inside
  # that job.
  build-no-jit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/setup-linux-toolchain

      # Outside the shared `Linux-ccache-` prefix like the other variant jobs
      # (canvas/webview/assert), so build-ubuntu's fallback restore can never
      # land on this cache and miss on every TU.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-nojit-ccache-${{ github.sha }}
          restore-keys: |
            linux-nojit-ccache-

      - name: Build and run (no LLVM)
        run: just test-no-jit

      - name: Report ccache stats
        run: ccache -s

  # Release-to-release differential (tools/difftest/release_diff.sh): the
  # generated corpus under the latest published binary and under this commit,
  # each on its own default engine, with every behavioural change named in
  # release_diff_allow.txt.
  #
  # This is the differential oracle now that the tree-walker is gone. The
  # executor and the LLVM lowering are handed bytecode by the same compiler,
  # so they can only agree with each other; a released binary is an
  # independent implementation that cannot drift with the working tree
  # (docs/internals/vm.md §10.3).
  #
  # master pushes only. It compares against a release, so it says nothing about
  # a topic branch that has not landed yet, and what the default-engine switch
  # needs watched is exactly the landed commits.
  #
  # The two binaries are configured differently — a release is built with the
  # Canvas desktop window on, build-ubuntu's artifact with it off — and the
  # corpus does not notice, because its Canvas cases only ever read and write
  # an offscreen framebuffer. Nothing in the corpus opens a window.
  release-diff:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The justfile defaults this for its recipes and the script below is run
      # directly. A runner has no display, and the released binary — unlike
      # build-ubuntu's artifact — does have the window backend compiled in, so
      # without the declaration its Canvas cases would all fail to open one.
      CULEBRA_CANVAS_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Download the built culebra
        uses: actions/download-artifact@v4
        with:
          name: culebra-ubuntu-latest
          path: build

      # Artifacts drop file modes.
      - name: Restore the exec bit
        run: chmod +x build/culebra

      # No tag: the baseline is whatever is published, so a release moves this
      # gate forward on its own.
      - name: Fetch the latest release binary
        run: |
          mkdir -p build/baseline
          gh release download --pattern 'culebra-linux-x64.tar.gz' \
            --dir build/baseline
          tar xzf build/baseline/culebra-linux-x64.tar.gz -C build/baseline

      - name: Diff against the previous release
        run: |
          base=$(ls -d build/baseline/culebra-*/culebra)
          tools/difftest/release_diff.sh "$base" ./build/culebra

  # The Playground is a build no runner can make — nothing here has emsdk — so
  # what ships is the committed site/playground/*.wasm. This runs it: node
  # loads the artifact, every case runs twice in one instance, and the output
  # has to match the same program on the native executor. Twice, because the
  # page keeps one instance across Run clicks, and a run that leaves state in
  # the Runtime is invisible to any check that runs a program once
  # (docs/internals/vm.md §9). No build of its own — the binary is
  # build-ubuntu's artifact, the way release-diff takes it.
  playground-smoke:
    needs: build-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download the built culebra
        uses: actions/download-artifact@v4
        with:
          name: culebra-ubuntu-latest
          path: build

      # Artifacts drop file modes.
      - name: Restore the exec bit
        run: chmod +x build/culebra

      - name: Run the committed wasm against native --vm
        run: node tools/playground/smoke.mjs ./build/culebra

  # The macOS leg of what used to be a two-OS test matrix, unchanged in what
  # it runs: the clean-env build + the SKIP_HEAVY `_run-tests all` sweep +
  # the macOS-only smokes. The test suite's heavy phases (the generated
  # difftest + the per-test AOT links) are platform-independent and run in
  # the Ubuntu lanes above and in local dev; the slow 3-core macOS runner
  # takes ~30 min on them for no extra coverage. Apple's ld-prime (Xcode 15+)
  # is fast enough that no mold-style linker override is needed.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The 7 GB macOS runner swaps when compiling >2 LLVM-header-heavy TUs
      # (~3 GB each) at once — cap `just build`'s `make -j` to 2 (cuts
      # ~64 min → ~18).
      CULEBRA_BUILD_JOBS: "2"
      # `_run-tests all` skips the platform-independent heavy phases
      # (difftest, leak sweeps, gc-stress, AOT) when this is non-empty.
      CULEBRA_TEST_SKIP_HEAVY: "1"
      # A runner has no display; building the vendored SDL3 + raylib statics
      # would add ~4 min. Job-wide env, not a -D on the build step, so every
      # cmake configure agrees.
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
      # ccache as the compiler launcher via env (job-wide), so the `just
      # build` prereq `just smoke-microgpt` re-runs configures identically.
      # CCACHE_DIR is pinned under the workspace so the path is identical
      # between actions/cache and ccache itself (brew ccache defaults to
      # ~/Library/Caches/ccache otherwise).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # coreutils provides `gtimeout` — `just test` uses it to bound each
          # test so a frozen macOS VM fails the phase fast instead of hanging
          # the job (macOS has no native `timeout`).
          brew install llvm just ccache coreutils

      # Compiler cache for incremental CI builds. Without it every PR push
      # re-compiles culebra from scratch (~4 min, dominated by
      # LLVM-header-heavy jit.h translation units). The LLVM
      # static link itself is not cached.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build (interpreter + JIT)
        run: just build

      # A binary to try on a real desktop — this one carries Webview (macOS
      # needs no extra packages for it) but Canvas headless.
      - name: Upload the binary for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: culebra-macos-latest
          path: build/culebra
          retention-days: 1
          compression-level: 1  # ~5x faster than the default, 12% larger

      - name: Report ccache stats
        run: ccache -s

      - name: Test (vm/JIT diff + embedding smoke + culebra-test self)
        # Reuse the LTO build/ from the Build step rather than letting `just
        # test` spin up a second no-LTO build-gate/ — this also keeps the
        # gate exercising the LTO binary. (Local dev gets the fast no-LTO
        # gate via plain `just test`.)
        run: BIN=./build/culebra just _run-tests all

      - name: Doctest (docs examples, VM + JIT)
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          ./build/culebra test --doc --vm --jobs "$jobs" tests/doctest docs
          ./build/culebra test --doc --jit --jobs "$jobs" tests/doctest docs

      # Same as the ubuntu lane, and worth its own run here: the headers a
      # host includes carry per-platform branches, so a macOS-only break in
      # them shows up nowhere else.
      - name: Doctest (embedding examples compile)
        run: just check-docs-cpp

      - name: Smoke test microgpt (5 steps, both backends)
        run: just smoke-microgpt

      # macOS builds Webview by default and needs no packages, so this costs
      # only the run. (Ubuntu self-disables it for want of gtk4/webkitgtk,
      # where `Webview` is then an undefined name — skip rather than pretend.)
      - name: Smoke — Webview window + event loop (vm / JIT)
        run: misc/aot_axes/probe_webview_window.sh ./build/culebra

      # The driver is dead-stripped (CMakeLists, -Wl,-dead_strip) and the AOT
      # link is where ld64 has the most to get wrong about it: materialize the
      # embedded archives, -force_load the axes, resolve the runtime helpers.
      # This job sets CULEBRA_TEST_SKIP_HEAVY=1, so nothing else here builds an
      # AOT binary, and Ubuntu's dead-strip is a different linker's. One link,
      # not the per-test AOT sweep SKIP_HEAVY exists to avoid.
      #
      # The program is picked for what an AOT object holds beyond code:
      # parameter metadata, which the lowering emits as module globals (a
      # JIT-only path could point at the compiling process's own structs; an
      # object outlives it). Keyword binding, defaults, kw-only and
      # `fn.params` all read those globals at run time, so a link that
      # resolves them wrongly fails here instead of on a user's desktop.
      - name: Smoke — AOT survives the driver's dead-strip
        run: |
          cat > aot_smoke.cul <<'EOF'
          fn greet(name: String, greeting = 'hi', *, loud: Bool = false) -> String {
            let s = "{greeting}, {name}"
            if loud { s.upper() } else { s }
          }
          let twice = |x| x * 2
          let ps = greet.params
          println("{greet(name: 'a', loud: true)}|{greet('b')}|{greet.name}|{greet.return_type}|{ps.size()}{ps[1].has_default}{ps[2].kw_only}|{[1, 2, 3].map(twice).sum()}")
          EOF
          ./build/culebra build aot_smoke.cul -o aot_smoke
          test "$(./aot_smoke)" = 'HI, A|hi, b|greet|String|3truetrue|12'

  # The Canvas desktop window backend is the one part of the tree no other job
  # builds: the build/test jobs above pin CULEBRA_CANVAS_WINDOW_DEFAULT=OFF, and
  # release.yml (which does leave CMake's ON default alone) only runs on a `v*`
  # tag. Without this job and its macOS twin below, the raylib present/input
  # bodies, the weak-stub split in culebra_rt, and the culebra_rt_canvas
  # force-load axis would compile nowhere — a break in them surfacing at release
  # time, or on a contributor's desktop.
  #
  # Not a second full gate: CULEBRA_ENABLE_CANVAS_WINDOW changes only how
  # present/input reach a display. The framebuffer core every Canvas test
  # asserts on is the same code either way and the jobs above already gate
  # it, so this job proves the parts that differ — that the window build
  # compiles and links, that the headless path still works inside it, that the
  # AOT weak choke resolves, and that a window really opens (under Xvfb).
  linux-canvas-window:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Deliberately no CULEBRA_CANVAS_WINDOW_DEFAULT — this job wants CMake's
      # own Linux default, which is ON once SDL3's build dependencies are
      # installed below. Setting it here would make the job assert a knob it
      # had itself turned on, rather than the default a contributor gets.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Keep the vendored-statics cache inside the workspace so actions/cache
      # can carry it between runs (it defaults to ~/.cache/culebra/deps).
      CULEBRA_DEPS_CACHE: ${{ github.workspace }}/.deps-cache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # xvfb is for the window smoke below; the SDL3 deps are what leave the
      # Canvas window at CMake's Linux default, which is this job's subject.
      - name: Install toolchain
        uses: ./.github/actions/setup-linux-toolchain
        with:
          sdl3-deps: 'true'
          extra-packages: xvfb

      # The SDL3 + raylib statics are ~4 min of build that depends only on the
      # two submodule revisions. misc/deps_cache_key.sh is the one spelling of
      # that key — the release job restores what a CI job saved, and a drift
      # between them fails as an eternally cold build rather than as a red job.
      - name: Vendored SDL3 + raylib revisions
        id: vendor
        run: echo "key=$(misc/deps_cache_key.sh linux-canvas-deps)" >> "$GITHUB_OUTPUT"

      - name: Restore SDL3 + raylib statics
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps-cache
          key: ${{ steps.vendor.outputs.key }}

      # No cross-job fallback key, for linux-assert's reason: the window knob is
      # a target-wide define, so this lane's compile commands differ from the
      # window-OFF jobs' on every TU that matters (main.cc among them). A
      # restore from theirs would hit ~0% and merge back as bloat.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-canvas-ccache-${{ github.sha }}
          restore-keys: |
            linux-canvas-ccache-

      # Full `just build`, not the DEV_NO_RT inner-loop build: the window knob
      # also splits culebra_rt's Canvas ops into weak headless stubs and adds
      # the culebra_rt_canvas archive, and DEV_NO_RT skips every AOT archive.
      # LTO on (`just build`'s default): with the window ON this is the Linux
      # download's configuration. build-ubuntu links with LTO and the window
      # off, so each half was covered and their product — what ships — was not.
      - name: Build (window backend ON, LTO on — the Linux download's config)
        run: just build -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold

      - name: Report ccache stats
        run: ccache -s || true

      # Without this the job goes green against a headless build, having proved
      # nothing it exists for. Same script release.yml runs on its assets, so
      # the two cannot end up asserting different cache entries.
      - name: Verify the window backend is actually in this build
        run: misc/aot_axes/verify_canvas_window.sh build

      # The coexistence requirement: a window-enabled binary must still take the
      # headless path on demand, byte-identically, on every engine — the
      # default one included, which is why --vm leads. Set explicitly rather
      # than inherited: the binary is invoked directly here, so it does not
      # pick up the export every `just` recipe gets.
      - name: Canvas tests (headless inside the window build)
        env:
          CULEBRA_CANVAS_HEADLESS: "1"
        run: |
          fail=0
          for t in tests/test_canvas.cul tests/test_canvas_module.cul; do
            for flag in "--vm" "--jit"; do
              if ./build/culebra $flag "$t" > /dev/null; then
                echo "PASS $t ($flag)"
              else
                echo "::error::FAIL $t ($flag)"; fail=1
              fi
            done
          done
          exit $fail

      - name: AOT link + run (Canvas force-load axis)
        run: misc/aot_axes/probe_canvas_aot_link.sh ./build/culebra .

      # The only step that exercises raylib itself: window creation, a present,
      # and teardown against Xvfb's software GL. Everything above passes on a
      # binary whose raylib bodies are never entered.
      - name: Open a real window (Xvfb)
        run: |
          cat > canvas_window.cul <<'EOF'
          Canvas.init(64, 48)
          Canvas.clear(Canvas.rgba(0, 128, 255))
          Canvas.present()
          println("window ok")
          EOF
          out=$(CULEBRA_CANVAS_HEADLESS=0 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ./build/culebra --vm canvas_window.cul)
          [ "$out" = "window ok" ] || { echo "::error::windowed run: [$out]" >&2; exit 1; }
          echo "OK: window opened and presented"

      # The reason CMakeLists.txt can default this ON for everyone: SDL3 dlopens
      # X11/GL/audio on first use, so a window build still starts on a headless
      # machine. A DT_NEEDED entry on any of them would break that promise — and
      # break every displayless `culebra --version`. Same guard release.yml runs
      # on its Linux asset; last here so a surprise in it can't mask the build
      # and run results above, which are what this job primarily exists for.
      - name: Verify no display stack in the link
        run: |
          deps=$(ldd build/culebra)
          echo "$deps"
          if echo "$deps" | grep -iE 'libX11|libGL|libEGL|libwayland|libSDL|libasound|libpulse'; then
            echo "::error::the window build needs a display/audio stack to start" >&2
            exit 1
          fi
          echo "OK: no display runtime dependency"

      # The packaging release.yml runs, on every push rather than only on a
      # `v*` tag — which is how its bare engine smoke stayed broken until a
      # release tried to build. Here rather than in build-ubuntu because this
      # job holds the Linux download's configuration and is off the critical
      # path. The archive is not uploaded; what is checked is that the script
      # runs.
      - name: Dry-run the release packaging
        env:
          CULEBRA_PACKAGE_UNTAGGED: 1  # a push reaches no tag; its build says so
        run: |
          v=$(sed -n 's/^#define CULEBRA_VERSION "\([^"]*\)"/\1/p' include/culebra.h)
          [ -n "$v" ] || { echo "no CULEBRA_VERSION in include/culebra.h" >&2; exit 1; }
          misc/package_release.sh ./build/culebra "v$v" linux x64

  # The macOS half of the job above: test-macos pins the window OFF, so this is
  # the macOS download's configuration and nothing but a `v*` tag used to build
  # it. Two of the Linux job's steps are absent — a macOS runner has no display
  # server, and `otool -L` naming system frameworks is by design, not a
  # regression. The AOT step stays: test-macos links one AOT binary, but with
  # the window OFF, so the culebra_rt_canvas force-load is macOS-uncovered.
  macos-canvas-window:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Deliberately no CULEBRA_CANVAS_WINDOW_DEFAULT — CMake's own macOS
      # default is this job's subject, the way it is the Linux job's.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CULEBRA_DEPS_CACHE: ${{ github.workspace }}/.deps-cache
      CULEBRA_BUILD_JOBS: "2"  # the runner swaps above 2; see test-macos
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: brew install llvm just ccache

      - name: Vendored SDL3 + raylib revisions
        id: vendor
        run: echo "key=$(misc/deps_cache_key.sh macos-canvas-deps)" >> "$GITHUB_OUTPUT"

      - name: Restore SDL3 + raylib statics
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps-cache
          key: ${{ steps.vendor.outputs.key }}

      # No cross-job fallback key, for linux-assert's reason: the window knob is
      # a target-wide define, so this lane shares no compile command with
      # test-macos on the TUs that cost anything (main.cc among them). A restore
      # from theirs would hit ~0% and merge back as bloat.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: macos-canvas-ccache-${{ github.sha }}
          restore-keys: |
            macos-canvas-ccache-

      - name: Build (window backend ON, LTO on — the macOS download's config)
        run: just build

      - name: Report ccache stats
        run: ccache -s || true

      - name: Verify the window backend is actually in this build
        run: misc/aot_axes/verify_canvas_window.sh build

      # A window-enabled binary must still take the headless path on demand,
      # byte-identically, on every engine. Set explicitly — the binary is
      # invoked directly here, so it does not pick up the export every `just`
      # recipe gets.
      - name: Canvas tests (headless inside the window build)
        env:
          CULEBRA_CANVAS_HEADLESS: "1"
        run: |
          fail=0
          for t in tests/test_canvas.cul tests/test_canvas_module.cul; do
            for flag in "--vm" "--jit"; do
              if ./build/culebra $flag "$t" > /dev/null; then
                echo "PASS $t ($flag)"
              else
                echo "::error::FAIL $t ($flag)"; fail=1
              fi
            done
          done
          exit $fail

      - name: AOT link + run (Canvas force-load axis)
        run: misc/aot_axes/probe_canvas_aot_link.sh ./build/culebra .

      # The packaging release.yml runs on this binary — the macOS branch of the
      # script (shasum, the tarball) otherwise runs only under a `v*` tag, and
      # this job holds the configuration a release actually packages.
      - name: Dry-run the release packaging
        env:
          CULEBRA_PACKAGE_UNTAGGED: 1  # a push reaches no tag; its build says so
        run: |
          v=$(sed -n 's/^#define CULEBRA_VERSION "\([^"]*\)"/\1/p' include/culebra.h)
          [ -n "$v" ] || { echo "no CULEBRA_VERSION in include/culebra.h" >&2; exit 1; }
          misc/package_release.sh ./build/culebra "v$v" macos arm64

  # Scene is the one namespace no released binary carries: CMake defaults it
  # OFF, so until this job nothing built it anywhere — the wrap binding, the
  # culebra_rt_scene archive and the CULEBRA_SCENE_LINK fragment compiled in no
  # lane, and the axis was as verified as the last time someone ran it by hand.
  # It is also the only place tools/checks/check_rt_archive_tls.sh ever sees that
  # archive, which is the ratchet standing behind the Windows twin below.
  #
  # Rendering is checked here and nowhere else. Scene has no headless mode —
  # View.new opens a window or raises — so a frame is drawn under Xvfb and read
  # back through Canvas's headless framebuffer. Everything else about the axis
  # (the build, the archive, the AOT link) passes on a binary whose raylib
  # bodies are never entered.
  linux-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CULEBRA_DEPS_CACHE: ${{ github.workspace }}/.deps-cache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Scene rides the same vendored SDL3 + raylib as the Canvas window, so it
      # wants the same build dependencies; xvfb is for the render smoke.
      - name: Install toolchain
        uses: ./.github/actions/setup-linux-toolchain
        with:
          sdl3-deps: 'true'
          extra-packages: xvfb

      # Deliberately the Canvas lane's key, not one of this job's own: same
      # platform and same two submodules means the same tree, so whichever lane
      # runs first pays the ~4 min and the other restores it.
      - name: Vendored SDL3 + raylib revisions
        id: vendor
        run: echo "key=$(misc/deps_cache_key.sh linux-canvas-deps)" >> "$GITHUB_OUTPUT"

      - name: Restore SDL3 + raylib statics
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps-cache
          key: ${{ steps.vendor.outputs.key }}

      # No cross-job fallback key: CULEBRA_ENABLE_SCENE is a target-wide define,
      # so every culebra TU's command line differs from the Scene-OFF jobs' and
      # a restore from theirs would hit ~0% and merge back as bloat.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-scene-ccache-${{ github.sha }}
          restore-keys: |
            linux-scene-ccache-

      # `just build-scene` is where this lane's configuration lives, so a
      # contributor gets the same build with one word. LTO off (Scene is not a
      # shipped configuration, so it would only cost the link) and the AOT
      # runtime archives kept, which the ratchet and the AOT probe both need.
      - name: Build (Scene ON)
        run: just build-scene -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold

      - name: Report ccache stats
        run: ccache -s || true

      # Without this the job could go green on a build where CMake quietly left
      # the namespace off, having proved nothing it exists for. Same script the
      # Windows lane runs, for the reason its Canvas and Webview siblings exist.
      - name: Verify Scene is actually in this build
        run: misc/aot_axes/verify_scene_axis.sh build-scene

      # The only step that enters raylib's window, GL and shader path. One X
      # server for both engines; the probe is what knows there are two.
      - name: Render a frame (Xvfb, vm / JIT)
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            misc/aot_axes/probe_scene_window.sh ./build-scene/culebra

      # Display-free by construction (the Scene call sits under `if false`), so
      # what it reports is the link: the force-load of libculebra_rt_scene.a
      # beside the core archive. Its Windows twin is the same script.
      - name: AOT link + run (Scene force-load axis)
        run: misc/aot_axes/probe_scene_aot_link.sh ./build-scene/culebra

      # The archive Scene adds is one of the three that reach wrap.h, so it can
      # leave a `culebra_runtime_*` helper the compiler declined to inline
      # against the core archive's strong one. On ELF that folds silently; on PE
      # it is a failed link, which is why the count is ratcheted here rather
      # than discovered on Windows.
      - name: Runtime archive discipline (with the Scene archive present)
        run: tools/checks/check_rt_archive_tls.sh build-scene

  # Linux is the only platform where culebra has to find the WebView engine
  # itself (macOS links a system framework; Windows lets webview.h's own loader
  # locate the Edge runtime), and the Ubuntu test jobs above install no gtk4 or
  # webkitgtk, so there the namespace self-disables and every Webview path
  # compiles out. That left the whole Linux engine — the dlopen table, the
  # window, the event loop, the AOT force-load — proved only by hand on a
  # developer's machine. This job is that coverage.
  linux-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # xvfb is for the window smoke below. No SDL3 build deps on purpose:
      # without them the Canvas window self-disables, and this job builds only
      # what it is about.
      - name: Install toolchain
        uses: ./.github/actions/setup-linux-toolchain
        with:
          webview-deps: 'true'
          extra-packages: xvfb

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-webview-ccache-${{ github.sha }}
          restore-keys: |
            linux-webview-ccache-
            ${{ runner.os }}-ccache-

      # Full `just build`, not the inner-loop one: the AOT steps below need the
      # feature archive, which DEV_NO_RT skips. LTO off — this job proves links
      # and behaviour, and the matrix already pays a ThinLTO link on this OS.
      - name: Build (Webview ON)
        id: build
        run: just build -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold -DCULEBRA_LTO=OFF

      - name: Report ccache stats
        run: ccache -s || true

      # Without this every step below still passes, against a build with no
      # Webview in it at all — this job would prove nothing and say so in green.
      - name: Verify the Webview axis is actually in this build
        run: misc/aot_axes/verify_webview_axis.sh build

      # The load-time contract, for the driver and for a `culebra build` output:
      # no engine in DT_NEEDED, no forwarder in .dynsym. This is the property
      # that lets one Linux binary carry Webview and still start on a machine
      # with no desktop stack, so it is checked before anything opens a window.
      - name: Webview dynload ratchet
        run: tools/checks/check_webview_dynload.sh build

      # The AOT axis: naming Webview has to force-load libculebra_rt_webview.a,
      # which is also where the dlopen table lives. The driver links that TU
      # directly, so a broken force-load shows up only here. Before the window
      # step because it needs no display: a runner whose Xvfb or WebKit sandbox
      # misbehaves should still report on everything that does not depend on one.
      - name: AOT link + run (Webview force-load axis)
        run: misc/aot_axes/probe_webview_aot_link.sh ./build/culebra

      # Ubuntu 24.04's AppArmor lets an unconfined binary *create* an
      # unprivileged user namespace but denies capability use inside it. That is
      # the worst of the three possible worlds for WebKit: its bwrap sandbox
      # starts (creation succeeded — so WebKit's own "no user namespaces, run
      # unsandboxed" detection never fires), then cannot finish bootstrapping
      # the web process (`bwrap: loopback: Failed RTM_NEWADDR: Operation not
      # permitted`), and the parent aborts in a g_error. Measured here on the
      # first run of this job: exit 133, with the sysctl reading 1.
      #
      # The fix is the one Ubuntu itself ships for Chrome, Discord and every
      # other third-party userns consumer, and the one that resolved the same
      # crash for WebKit apps (Launchpad #2060810): an AppArmor profile naming
      # the binary and granting `userns`. bwrap inherits it across exec, the
      # restriction stays live for everything else on the runner, and — unlike
      # the sysctl, or WebKit's do-not-sandbox env switch — the probe below
      # still exercises the sandbox a desktop user's app would actually run in.
      # Ubuntu-only, like the quirk itself: no other distro restricts these
      # namespaces, and an up-to-date Ubuntu (24.04.2+) ships a bwrap profile
      # that makes even this step unnecessary — this runner image is the
      # stripped case that lacks it. The README documents both.
      - name: Let the sandbox use its user namespaces (AppArmor profile)
        run: |
          sudo tee /etc/apparmor.d/culebra-ci >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile culebra-ci $PWD/build/culebra flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/culebra-ci
          echo "OK: profile loaded for $PWD/build/culebra"

      # What no other job on any OS reaches: a real window, the event loop, a
      # quit from another thread, and a quit that lands before the loop starts —
      # on both backends, against Xvfb.
      #
      # The probe treats "no window engine here" as a pass, which is right for a
      # developer's headless box and wrong here: it would let a broken Xvfb turn
      # this into a green job that opened nothing. So the output is checked for
      # that outcome as well as for the exit status.
      - name: Window + event loop (Xvfb, vm / JIT)
        run: |
          # `|| rc=$?` rather than a bare assignment: the step runs under
          # `bash -e`, where a failing command substitution ends the step at the
          # assignment and takes the probe's output — the only thing worth
          # having when this fails — with it.
          rc=0
          out=$(xvfb-run -a misc/aot_axes/probe_webview_window.sh ./build/culebra 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "--- environment, for a failure that is the runner's and not the probe's ---"
            echo "bwrap: $(command -v bwrap || echo absent)"
            echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
            echo "webkit processes: $(ls /usr/libexec/webkitgtk-6.0 /usr/lib/x86_64-linux-gnu/webkitgtk-6.0 2>/dev/null | tr '\n' ' ')"
            echo "::error::the window probe failed (exit $rc)" >&2
            exit "$rc"
          fi
          if echo "$out" | grep -q 'no window engine here'; then
            echo "::error::no display under Xvfb — the probe passed without opening a window" >&2
            exit 1
          fi
          echo "OK: real windows, on both backends"

      # The point of the whole design, and the one thing that cannot be checked
      # on a machine that has the engine: with the runtime libraries gone, the
      # binary still starts and still runs a program that opens no window, and
      # asking for one fails the way it does on macOS and Windows. Last, and
      # destructive to this runner's WebKit install by design — nothing after it
      # could trust the engine to be there. Runs even when a step above failed
      # (it needs only a driver), so one run reports on the whole job rather
      # than stopping at the first display-dependent thing that went wrong.
      - name: Start with no engine present
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo mv /usr/lib/x86_64-linux-gnu/libwebkitgtk-6.0.so.4 /tmp/wk.hidden
          sudo mv /usr/lib/x86_64-linux-gnu/libgtk-4.so.1 /tmp/gtk.hidden
          ./build/culebra --version || { echo "::error::the driver needs the engine to start" >&2; exit 1; }
          echo 'println("no window here")' > plain.cul
          out=$(./build/culebra --vm plain.cul)
          [ "$out" = "no window here" ] || { echo "::error::plain program: [$out]" >&2; exit 1; }
          out=$(timeout 60 ./build/culebra --vm tests/gui/webview_probe.cul 2>&1 || true)
          case "$out" in
            *"failed to create window"*) echo "OK: starts, runs, and fails only at the window" ;;
            *) echo "::error::expected the create-window failure, got: [$out]" >&2; exit 1 ;;
          esac

  # The only lane that runs with asserts live. Every other job — and every local
  # `just` build — is CMAKE_BUILD_TYPE=Release, i.e. -DNDEBUG, so the tree's
  # asserts never execute: rt_slab.h's cross-allocator-free guard sat dead
  # while exactly that corruption shipped and surfaced as an intermittent
  # SIGABRT in the isolate lane. Ubuntu only — these asserts check
  # backend-neutral invariants (Runtime teardown, the GC heap, the slab), so a
  # second OS would buy runner time and no coverage.
  linux-assert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install toolchain
        uses: ./.github/actions/setup-linux-toolchain

      # No cross-job fallback key: this lane shares no compile command with any
      # other, so a restore from theirs would hit ~0% and merge back as bloat.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-assert-ccache-${{ github.sha }}
          restore-keys: |
            linux-assert-ccache-

      - name: Build (asserts enabled)
        run: just build-assert -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold

      # Without this the job goes green while proving nothing: NDEBUG creeping
      # back into the Release flags would silently compile every assert away and
      # the sweep below would still pass. The message text is only in the binary
      # when the assert survived preprocessing.
      - name: Verify the asserts are actually in this build
        run: |
          if ! grep -qa 'slab free of a pointer this allocator never handed out' \
              build-assert/culebra; then
            echo "::error::built with NDEBUG — every assert compiled away, so this job proves nothing." >&2
            grep -i 'CMAKE_CXX_FLAGS_RELEASE' build-assert/CMakeCache.txt >&2 || true
            exit 1
          fi
          echo "OK: asserts compiled in"

      # Reuse the binary from the Build step — plain `just test-assert` would
      # re-run its build-assert prerequisite, reconfiguring without the mold
      # flag above.
      - name: Tests (asserts enabled)
        run: BIN=./build-assert/culebra CULEBRA_TEST_SKIP_HEAVY=1 just _run-tests fast

      - name: Report ccache stats
        run: ccache -s || true

  # Windows port — the no-LLVM driver (no JIT/AOT) with the OS-heavy
  # optional features off, proving the core language + stdlib + SQLite compile
  # and run on Windows. Phase 1 landed the core; Phase 2 added Proc (subprocess)
  # and Term (terminal raw-mode); Phase 3 added cross-process SharedBuffer
  # (CreateFileMapping + named mutex). Only JIT/AOT remains stubbed on Windows.
  # Kept a separate job from the JIT/AOT matrix above, whose `just build` /
  # `just test` steps assume the full LLVM toolchain.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25  # a runtime hang (e.g. a Proc deadlock) fails fast here
    env:
      # windows-aot-build is the job that proves the Canvas window backend; off
      # here (and job-wide, so any configure agrees) keeps this a fast
      # portability check instead of paying for the vendored SDL3 + raylib.
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mingw-w64 (GCC 14+ / libstdc++) rather than MSVC: the codebase's central
      # recursive Value type is used through std::vector<Value> while still
      # incomplete, which libstdc++ (as on Linux/macOS) accepts but the MSVC STL
      # rejects. mingw keeps the Linux STL behaviour, so the core compiles with
      # no changes. The binary is linked fully static (-static: libstdc++ /
      # libgcc / libwinpthread), so it runs on a plain Windows box with no mingw
      # runtime DLLs — verified below.
      #
      # UCRT64, not MINGW64: same gcc and libstdc++, but ucrtbase.dll instead of
      # the frozen msvcrt.dll that predates C99 (its printf has no %lld and
      # writes 3-digit exponents; it has no UTF-8 locale). UCRT ships with
      # Windows 10, which is already this build's floor (_WIN32_WINNT=0x0A00).
      # MSYS2 also treats UCRT64 as the default environment now, and packages
      # increasingly land there only — mingw-w64-x86_64-webview2-loader does not
      # exist, its ucrt counterpart does.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib

      - name: Configure (no LLVM, static, Phase 1 feature set)
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCULEBRA_ENABLE_JIT=OFF \
            -DCULEBRA_ENABLE_HTTP=OFF \
            -DCULEBRA_ENABLE_WEBVIEW=OFF \
            -DCULEBRA_DEV_NO_RT=ON \
            -DCULEBRA_LTO=OFF

      # `-k 0` keeps building after the first error so a CI run surfaces the full
      # set of Windows-portability breakages at once instead of one per push.
      - name: Build (culebra driver)
        run: cmake --build build-win --target culebra -j -- -k 0

      # Prove the "runs on a plain Windows box" claim. The allowlist lives in
      # the script, shared with windows-aot-build and the release build.
      - name: Verify standalone binary (only system DLLs)
        run: misc/windows_toolchain/verify_standalone_exe.sh build-win/culebra.exe

      - name: Smoke test (interp runs a script + core stdlib)
        run: |
          cat > smoke.cul <<'EOF'
          fn check(cond, msg) { if !cond { throw "check failed: " + msg } }
          print("hello from culebra on windows")
          let xs = [3, 1, 2].sorted_by(fn(x) { x })
          check(xs.join(",") == "1,2,3", "sort")
          check("UPPER".lower() == "upper" && "abc".upper() == "ABC", "case")
          let o = {"a": 1, "b": 2}
          check(o.keys().sorted_by(fn(k) { k }).join(",") == "a,b", "keys")

          # Phase 2: Proc runs real subprocesses via CreateProcess/CreatePipe.
          let r = Proc.run(["cmd", "/c", "echo hi"])
          check(r.ok && r.code == 0, "Proc.run exit code")
          check(r.stdout.contains("hi"), "Proc.run stdout capture")
          # Non-zero exit is reported, not raised.
          let bad = Proc.run(["cmd", "/c", "exit 3"])
          check(!bad.ok && bad.code == 3, "Proc.run non-zero exit")
          # stdin is fed to the child (findstr echoes lines matching the pattern).
          let f = Proc.run(["findstr", "x"], stdin: "x marks\nno match\n")
          check(f.stdout.contains("x marks") && !f.stdout.contains("no match"),
                "Proc.run stdin feed")
          # allSettled batch of two concurrent children, results in input order.
          let batch = Proc.all([["cmd", "/c", "echo one"], ["cmd", "/c", "echo two"]])
          check(batch[0].stdout.contains("one") && batch[1].stdout.contains("two"),
                "Proc.all batch order")
          # Live handle: spawn, then wait for the reaped result.
          let h = Proc.spawn(["cmd", "/c", "echo spawned"])
          let hr = h.wait()
          check(hr.stdout.contains("spawned"), "Proc.spawn + wait")

          # Phase 2: Term primitives are callable off-tty (raw mode no-ops, size
          # falls back / queries the console, width is pure).
          check(Term.cols() > 0 && Term.rows() > 0, "Term size")
          check(Term.width("abc") == 3, "Term display width")

          # FS.watch: ReadDirectoryChangesW backend (macOS/Linux use FSEvents/
          # inotify — this is the only CI lane that exercises the Windows one).
          # No per-wait timeout, same as tests/test_fs_watch.cul: a hang here
          # is caught by this step's own `timeout 90` instead.
          let wdir = "fswatch_smoke"
          FS.remove(wdir, recursive: true) if FS.exists(wdir)
          FS.mkdir(FS.join(wdir, "sub"))
          let w = FS.watch(wdir)
          FS.write(FS.join(wdir, "a.txt"), "one")
          let mut created = "none"
          for e in w {
            if e.path.ends_with("a.txt") { created = e.kind; break }
          }
          check(created == "created" || created == "modified", "FS.watch create")
          FS.write(FS.join(wdir, "sub", "deep.txt"), "d")
          let mut saw_nested = false
          for e in w {
            if e.path.ends_with("deep.txt") { saw_nested = true; break }
          }
          check(saw_nested, "FS.watch recursive subtree")
          FS.remove(FS.join(wdir, "a.txt"))
          let mut saw_delete = false
          for e in w {
            if e.path.ends_with("a.txt") && e.kind == "deleted" {
              saw_delete = true
              break
            }
          }
          check(saw_delete, "FS.watch delete")
          w.close()

          print("smoke ok")
          EOF
          # Bound the run so a future regression that deadlocks fails the step in
          # ~90s (exit 124) instead of hanging the whole job to its timeout.
          timeout 90 ./build-win/culebra.exe --vm smoke.cul

      # Phase 3: cross-process SharedBuffer via CreateFileMapping + MapViewOfFile
      # + a named mutex (POSIX uses mmap + fd inheritance + an in-region
      # PROCESS_SHARED pthread mutex). Exercises the three lanes stubbed in Phase
      # 1/2: `.shared` + Proc `share:` + `.receive` (a named pagefile mapping
      # passed to a child by name — no HANDLE inheritance), with_lock (the named
      # mutex serializing a contended counter), and `.file` (a mapping over a
      # path, read+written by a child process). The children are this same
      # culebra.exe re-run via Sys.executable.
      - name: Smoke test (cross-process SharedBuffer)
        run: |
          mkdir -p sbworker
          cat > sbworker/slot.cul <<'EOF'
          # Attach the parent's shared buffer by name, bump the shared counter
          # (cell 0) once under with_lock, then write this child's disjoint slot.
          @packable class Cell { v: Int64 = 0 }
          let grid = SharedBuffer.receive("grid", Cell)
          let slot = Sys.env("SLOT").to_long()
          grid.with_lock(fn() { grid[0].v = grid[0].v + 1 })
          grid[slot + 1].v = (slot + 1) * 100
          grid.drop()
          EOF
          cat > sbworker/file.cul <<'EOF'
          # Open the parent's file-backed buffer by path and echo cell 0 into
          # cell 1 (incremented), proving both processes map the same file.
          @packable class Cell { v: Int64 = 0 }
          let buf = SharedBuffer.file(Sys.env("SBPATH"), 4, Cell)
          buf[1].v = buf[0].v + 1
          buf.flush()
          buf.drop()
          EOF
          cat > sb_parent.cul <<'EOF'
          fn check(cond, msg) { if !cond { throw "check failed: " + msg } }
          @packable class Cell { v: Int64 = 0 }

          # `--vm` because a child inherits CULEBRA_REQUIRE_EXPLICIT_ENGINE
          # and must name its engine like any other launch (docs/internals/vm.md §2).
          let exe = Sys.executable
          check(exe != "", "Sys.executable resolved")

          # .shared + Proc share: + .receive + with_lock. Two concurrent children
          # each bump the shared counter once (named mutex must lose none) and
          # write their own disjoint slot (named mapping shared by name).
          let grid = SharedBuffer.shared(3, Cell)
          let h0 = Proc.spawn([exe, "--vm", "sbworker/slot.cul"], env: {"SLOT": "0"}, share: {"grid": grid})
          let h1 = Proc.spawn([exe, "--vm", "sbworker/slot.cul"], env: {"SLOT": "1"}, share: {"grid": grid})
          let r0 = h0.wait()
          let r1 = h1.wait()
          check(r0.ok && r1.ok, "share workers exit ok")
          check(grid[0].v == 2, "with_lock counter: no lost increment")
          check(grid[1].v == 100, "disjoint slot 0 write visible")
          check(grid[2].v == 200, "disjoint slot 1 write visible")

          # .file: a mapping over a path, written by a child, read back here.
          let path = "cul_sb_smoke.bin"
          let fbuf = SharedBuffer.file(path, 4, Cell)
          fbuf[0].v = 41
          fbuf.flush()
          let fr = Proc.run([exe, "--vm", "sbworker/file.cul"], env: {"SBPATH": path})
          check(fr.ok, "file worker exit ok: " + fr.stderr)
          check(fbuf[1].v == 42, "child's file write visible in parent's mapping")
          fbuf.drop()
          FS.remove(path)

          print("sharedbuffer cross-process ok")
          EOF
          timeout 90 ./build-win/culebra.exe --vm sb_parent.cul

  # Windows in-process JIT (Phase 4). Builds culebra with CULEBRA_ENABLE_JIT ON
  # under the mingw LLVM toolchain and runs a regression smoke over every codegen
  # path that needed a Win64-specific fix (16-byte-return sret ABI, the
  # ___chkstk_ms stack-probe symbol, class methods/getters/callable objects).
  # DEV_NO_RT=ON isolates the in-process JIT (no AOT runtime archives).
  #
  # Also carries the width gate (a separate configure further down, sharing
  # this job's msys2 setup rather than paying for its own runner + toolchain
  # install). culebra's Long is int64_t; C++ `long` is 32-bit under LLP64 and,
  # on macOS, a distinct 64-bit type. Linux — where everyone develops — is the
  # one platform that cannot see either, because there `long` IS int64_t, so a
  # language value left in a `long` compiles clean locally and silently
  # truncates on a download. That gate is the compiler saying so, without
  # paying for a build: -fsyntax-only over the two TUs that pull in every
  # header, with -Wconversion narrowed to the one diagnostic that means
  # "64-bit value into a 32-bit type". tools/checks/check_long_width.sh is the local
  # half of the same guard.
  windows-jit-build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CULEBRA_CANVAS_WINDOW_DEFAULT: OFF  # proved in windows-aot-build
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Union of this job's own packages and the width gate's (openssl,
      # webview2-loader, python, make) — one setup-msys2 install pays for
      # both configures below instead of two runners each installing most of
      # the same toolchain.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-webview2-loader
            mingw-w64-ucrt-x86_64-python
            make

      - name: Toolchain versions
        run: |
          g++ --version | head -1
          echo "llvm-config: $(llvm-config --version)"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-jit-ucrt-ccache-${{ github.sha }}
          restore-keys: |
            windows-jit-ucrt-ccache-

      - name: Configure (JIT ON, mingw LLVM, static, no AOT runtime)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build-win-jit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCULEBRA_ENABLE_JIT=ON \
            -DCULEBRA_ENABLE_HTTP=OFF \
            -DCULEBRA_ENABLE_WEBVIEW=OFF \
            -DCULEBRA_DEV_NO_RT=ON \
            -DCULEBRA_LTO=OFF

      - name: Build (culebra driver, JIT enabled)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build-win-jit --target culebra -j

      - name: Report ccache stats
        run: ccache -s || true

      # In-process JIT regression smoke: exercises every codegen path that
      # needed a Win64-specific fix. All informative (echo PASS/FAIL, never fail
      # the job) so one run reports the whole matrix. The rungs build up from a
      # bare print through arithmetic, closures, the 16-byte-return runtime
      # helpers (sret ABI), and class methods (which need the ___chkstk_ms
      # stack-probe symbol resolved).
      - name: Smoke — JIT (regression)
        run: |
          fail=0
          run() {  # $1=label $2=source
            printf '%s' "$2" > probe.cul
            echo "=== $1: culebra --jit ==="
            if timeout 60 ./build-win-jit/culebra.exe --jit probe.cul; then
              echo "${1}_PASS"
            else
              echo "${1}_FAIL rc=$?"
              fail=1
            fi
          }
          run JIT_PRINT_STR 'print("hi")'
          run JIT_PRINT_INT 'print(41)'
          run JIT_ARITH 'print(20 + 22)'
          run JIT_VAR 'let x = 7
          print(x * 6)'
          # Closures: no-arg / one-arg / nested / lambda / self-recursion.
          run JIT_FN_NOARG 'fn f() { return 1 }
          print(f())'
          run JIT_FN_ARG 'fn g(n) { return n + 1 }
          print(g(5))'
          run JIT_FN_NEST 'fn a() { return 2 }
          fn b() { return a() }
          print(b())'
          run JIT_LAMBDA 'let sq = fn(n) { n * n }
          print(sq(6))'
          run JIT_RECUR 'fn fib(n) { if n < 2 { return n }; return fib(n-1) + fib(n-2) }
          print(fib(10))'
          # 16-byte-return runtime helpers (routed through emit_value_call so the
          # Win64 sret ABI matches the C++ side): string `+` and `**` go through
          # num-binop helpers, unlike the inline int fast path; object.get uses
          # object_get_default.
          run JIT_STRCAT 'print("a" + "b")'
          run JIT_POW 'print(2 ** 10)'
          run JIT_OBJGET 'let o = { a: 1 }
          print(o.get("b", 99))'
          # The long tail of 16-byte-return helpers converted in a second pass
          # (an exhaustive scan; the first pass covered only the sites the
          # original port exercised). Self-checking: a shifted-arg garble
          # throws or mis-compares, so the exit code carries correctness.
          run JIT_TOLONG_STR 'if to_long("42") != 42 { throw "bad" }
          print("ok")'
          run JIT_TOFLOAT_STR 'if to_float("1.5") != 1.5 { throw "bad" }
          print("ok")'
          run JIT_ATAN2 'if Math.atan2(0.0, 1.0) != 0.0 { throw "bad" }
          print("ok")'
          run JIT_WCHOICE 'if Random.weighted_choice(["only"], [1.0]) != "only" { throw "bad" }
          print("ok")'
          run JIT_TENSOR_RED 'if Tensor.from([1.0, 2.0, 3.0]).mean() != 2.0 { throw "bad" }
          print("ok")'
          run JIT_TENSOR_ITEM 'if Tensor.from([7.0]).item() != 7.0 { throw "bad" }
          print("ok")'
          run JIT_PROC_KW 'let r = Proc.run(["cmd", "/c", "echo hi"], env: {A: "1"})
          if r.stdout.trim() != "hi" { throw "bad: " + r.stdout }
          print("ok")'
          # Classes: full new+method+property, a bare method dispatch, a getter
          # (getter_or_value helper), and a callable class object `C(args)`
          # (class_new_method helper) — the last two are 16-byte-return helpers
          # too. Method bodies also exercise the ___chkstk_ms stack probe.
          run JIT_CLASS 'class P { new(x) { self.x = x }
          val() { return self.x + 1 } }
          print(P.new(7).val())'
          run JIT_CLASS_METH0 'class P { new(x) {}
          m() { return 42 } }
          print(P.new(1).m())'
          run JIT_GETTER 'class P { new(x) { self.x = x }
          get val() { return self.x + 1 } }
          print(P.new(7).val)'
          run JIT_CLASSCALL 'class P { new(x) { self.x = x }
          v() { return self.x } }
          print(P(9).v())'
          exit $fail

      # EH JIT smoke — a throw must unwind through a defer and reach a catch,
      # exercising the seh0 personality end to end in-process (SEH unwind-table
      # registration + near-image JIT memory + personality RVA fix-up). Informative.
      - name: Smoke — JIT exceptions (seh0 personality)
        run: |
          cat > jit_eh.cul <<'EOF'
          fn boom() { throw "kaboom" }
          fn worker() { defer { print("deferred ran") }; boom() }
          try { worker() } catch e { print("caught: " + e) }
          print("done")
          EOF
          echo "=== culebra --jit jit_eh.cul ==="
          timeout 60 ./build-win-jit/culebra.exe --jit jit_eh.cul \
            && echo "JIT_EH_PASS" || echo "JIT_EH_FAIL rc=$?"

      # The width gate (see the job comment above): its own configure, in the
      # same runner, so it shares the msys2 toolchain install above instead of
      # paying for a second Windows VM.
      - name: Configure width gate (no build)
        env:
          CULEBRA_CANVAS_WINDOW_DEFAULT: OFF
        run: |
          # MSYS Makefiles, not Ninja: Ninja routes long compile lines through
          # response files that exist only once a build runs, so a configure-only
          # compile_commands.json points at .rsp files that are not there.
          cmake -S . -B build-width -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCULEBRA_ENABLE_JIT=ON \
            -DCULEBRA_ENABLE_HTTP=ON \
            -DCULEBRA_ENABLE_WEBVIEW=ON \
            -DCULEBRA_DEV_NO_RT=OFF \
            -DCULEBRA_LTO=OFF
      - name: Syntax-check for 64-bit values landing in 32-bit types
        run: misc/windows_toolchain/check_llp64_width.sh build-width

  # Windows AOT (`culebra build`): stand up native single-.exe generation on
  # Win64. Unlike the JIT job this builds WITH the runtime archives embedded
  # (DEV_NO_RT=OFF) so `culebra build` can link them, and exercises the link
  # driver's Windows path (g++ driver, double-quote quoting, -static, no
  # -no-pie). The EH smoke is the payoff: AOT's static .o unwind tables are
  # in-image, so a throw should unwind (unlike in-process JIT — see that job).
  # Also the job that proves the Canvas desktop window on Windows: it is the
  # only Windows configuration that both links the driver against the vendored
  # SDL3 + raylib statics and then links AOT binaries against the same pair
  # through CULEBRA_CANVAS_LINK. A runner has no display, so what is provable
  # here is the link and the headless-identical behaviour, not that a window
  # actually appears — the same limit the macOS and Linux jobs have.
  windows-aot-build:
    runs-on: windows-latest
    # 60 for the build, plus the kit pack and round trip that used to be a
    # second 30-minute job. Still well under the two budgets it replaces.
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # git is in this list because setup-msys2's PATH holds only the MSYS2
      # trees plus System32, and the runner's own git is in neither: the SDL3 +
      # raylib deps cache is keyed on the submodule revisions, so without a git
      # to read them the key is empty and every run rebuilds both from scratch.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-webview2-loader
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            git
            zip
      # clang++ and lld are what misc/windows_toolchain/configure_windows_release.sh and the AOT
      # link use (see the script for why not g++/GNU ld); the gcc package stays
      # installed because clang's libstdc++ and libgcc are its.
      - name: Toolchain versions
        run: |
          clang++ --version | head -1
          ld.lld --version | head -1
          g++ --version | head -1
          echo "llvm-config $(llvm-config --version)"
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-aot-ucrt-ccache-${{ github.sha }}
          restore-keys: |
            windows-aot-ucrt-ccache-
      # ccache does not cover the ExternalProject build of SDL3 + raylib end to
      # end (its install and publish steps are not compiles), so cache the
      # published tree. No restore-keys: a partial hit is a tree CMake ignores.
      - name: Resolve deps cache key
        id: deps
        run: echo "key=$(misc/deps_cache_key.sh windows-deps)" >> "$GITHUB_OUTPUT"
      # CULEBRA_DEPS_CACHE also keeps the tree off $HOME, which under MSYS2 is
      # an msys path the native toolchain reads as C:\home\...
      - name: Restore SDL3 + raylib deps cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: ${{ steps.deps.outputs.key }}
      # The widest Windows configuration, and the only job that builds Http
      # (static OpenSSL) and Webview (WebView2) on Windows — which is to say it
      # is the Windows download's, so it runs the same script release.yml does.
      # The window used to be pinned ON here; leaving it to CMake's default and
      # asserting it below is what release.yml does, and an assertion beats a
      # setting that cannot fail.
      - name: Configure (the Windows download's configuration)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CULEBRA_DEPS_CACHE: ${{ github.workspace }}/.deps
        run: misc/windows_toolchain/configure_windows_release.sh build-win-aot

      - name: Verify the Canvas window backend is in this build
        run: misc/aot_axes/verify_canvas_window.sh build-win-aot
      - name: Build (culebra driver + runtime archives)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        # Only the `culebra` target (+ its embedded runtime-archive deps), not
        # the POSIX-only test targets (dap_test needs poll.h; smoke_suite needs
        # C++23 std::print's -lstdc++exp) which the default `all` would build.
        # `-k 0` as in the `windows` job: this is the one clang lane, so a run
        # should list every TU it rejects, not the first.
        run: cmake --build build-win-aot --target culebra -j -- -k 0
      - name: Report ccache stats
        run: ccache -s || true
      # The widest build there is — Canvas window, Webview and Http all on — so
      # this is the one to try on a real desktop, and the only artifact with a
      # window backend in it.
      - name: Upload the binary for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: culebra-windows-x64
          path: build-win-aot/culebra.exe
          retention-days: 1
          compression-level: 1
      # Trivial AOT (no exceptions): exercises COFF object emit + the Windows
      # link driver (g++/quoting/-static). Verbose so the link command shows.
      - name: Smoke — trivial AOT (no EH)
        env:
          CULEBRA_VERBOSE: "1"
        run: |
          fail=0
          printf 'print(1 + 2)\n' > triv.cul
          echo "=== culebra build triv.cul ==="
          if ./build-win-aot/culebra.exe build triv.cul -o triv.exe; then
            echo "=== run triv.exe ==="
            ./triv.exe && echo "AOT_TRIVIAL_PASS" \
              || { echo "AOT_TRIVIAL_RUN_FAIL rc=$?"; fail=1; }
          else
            echo "AOT_TRIVIAL_BUILD_FAIL rc=$?"
            fail=1
          fi
          exit $fail
      # The one Windows-only path nothing else covers: a feature archive is
      # force-loaded by absolute path, and that path goes through cmd.exe. The
      # trivial smoke above never reaches it (no feature is named, so no archive
      # is force-loaded) and the runner's own paths have no spaces, so the
      # quoting can be wrong and still link. Name SQLite (embedded in this
      # configuration) and point the cache at a directory with spaces to put
      # both halves in play — with single-quote quoting this step fails to link.
      - name: Smoke — AOT force-load from a cache path with spaces
        env:
          CULEBRA_CACHE: ${{ github.workspace }}/cache dir with spaces
          CULEBRA_VERBOSE: "1"
        run: |
          printf 'let db = SQLite.open(":memory:")\nprint("sqlite ok")\n' > sq.cul
          if ./build-win-aot/culebra.exe build sq.cul -o sq.exe; then
            out=$(./sq.exe 2>&1); rc=$?
            echo "out=[$out] rc=$rc"
            [ "$out" = "sqlite ok" ] && echo "AOT_SPACED_CACHE_PASS" \
              || { echo "AOT_SPACED_CACHE_RUN_FAIL"; exit 1; }
          else
            echo "AOT_SPACED_CACHE_BUILD_FAIL rc=$?"
            exit 1
          fi
      # The Ubuntu aot lane runs this too, but Windows is where it matters most:
      # the OpenSSL statics an Http link needs come from an MSYS2 tree that is
      # the runner's, not the downloader's, and this build IS the download's
      # configuration. Fails if any absolute path outside the driver's own cache
      # reaches the link line.
      - name: Smoke — AOT link carries no build-machine path
        run: tools/checks/check_aot_link_portability.sh build-win-aot
      # Long is 64-bit here too. This is the platform where it was not — `long`
      # is 32 bits under LLP64, and the interpreter carried the payload in one —
      # so the shared test runs on the one runner that can tell, across all
      # three backends, which is where the widths used to disagree.
      - name: Test — Long is 64-bit (vm / JIT / AOT)
        run: |
          misc/run_all_backends.sh ./build-win-aot/culebra.exe \
            tests/test_long_width.cul "long width ok" LONG
      # The wrap machinery, through all three backends — and the only lane that
      # runs it on Windows. `wrap<T>` registers from a variable whose sole
      # purpose is its initializer, which is the shape lld's --gc-sections
      # silently drops (see include/interop/wrap.h); the JIT lanes prove the driver's
      # registrar survived and the AOT one proves the `__Foreign` archive's,
      # force-loaded by naming the namespace. tests/test_foreign.cul is the
      # same file `just test` runs everywhere else.
      # The whole suite, held to a list of known failures that only shrinks.
      # Until this, six of the 215 tests/*.cul ran on Windows — the reason a
      # registration the clang/lld switch dropped reached master. ~80 s.
      - name: Test — the suite, against the known-failure list
        run: tools/checks/check_suite_on_windows.sh ./build-win-aot/culebra.exe
      - name: Test — wrap fixture (vm / JIT / AOT)
        run: |
          misc/run_all_backends.sh ./build-win-aot/culebra.exe \
            tests/test_foreign.cul "'test_foreign OK'" FOREIGN
      # What the window backend adds, through all three backends: a window build
      # forced headless must behave exactly like a headless one. It names
      # `_Canvas`, which the AOT scan does not match against the `Canvas` axis,
      # so this does NOT force-load the canvas archive — the Linux job's
      # canvas_aot.cul is what covers that, and CULEBRA_CANVAS_LINK with it.
      #
      # Windows ran an inline copy of this until Long became 64-bit; the shared
      # test failed on nothing but that width.
      - name: Smoke — Canvas window build (vm / JIT / AOT)
        env:
          CULEBRA_CANVAS_HEADLESS: "1"
          CULEBRA_VERBOSE: "1"
        run: |
          misc/run_all_backends.sh ./build-win-aot/culebra.exe \
            tests/test_canvas.cul "canvas ok" CANVAS
      # Window creation itself, which the forced-headless step above skips. A
      # runner has no desktop, so either outcome is fine — SDL opens a window,
      # or it fails and the backend behaves headless. Hanging or crashing is
      # not. (`windowed()` is the call that creates the window.)
      - name: Smoke — Canvas window creation does not hang or crash
        run: |
          set +e  # as above: keep the captured output printable
          printf '_Canvas.init(8, 8)\nprint(_Canvas.windowed())\n' > win.cul
          out=$(timeout 60 ./build-win-aot/culebra.exe --vm win.cul 2>&1); rc=$?
          echo "out=[$out] rc=$rc"
          if [ $rc -ne 0 ]; then
            echo "ERROR: window probe exited $rc (124 = hung, 139 = crashed)" >&2
            # Where it died, so a crash here is actionable from the log alone
            # rather than costing a round trip to find out.
            gdb -batch -ex run -ex bt --args ./build-win-aot/culebra.exe --vm win.cul \
              2>&1 | tail -30
            exit 1
          fi
          case "$out" in
            *true|*false) echo "OK: window probe returned cleanly" ;;
            *) echo "ERROR: unexpected output" >&2; exit 1 ;;
          esac
      # Webview self-disables in CMake when WebView2.h is missing, and the
      # reference below is never executed, so only the archive's existence
      # proves the binding compiled. Naming both namespaces then proves the AOT
      # scan force-loads it and that CULEBRA_WEBVIEW_LINK / CULEBRA_SSL_LINK
      # resolve at link time.
      - name: Smoke — AOT with Webview + Http linked
        env:
          CULEBRA_VERBOSE: "1"
        run: |
          test -f build-win-aot/libculebra_rt_webview.a \
            || { echo "WEBVIEW_SILENTLY_DISABLED (WebView2.h not found?)"; exit 1; }
          printf 'let srv = Http.server()\nif false { let w = Webview.Window.new(); w.run() }\nprint("webview+http ok")\n' > wv.cul
          if ./build-win-aot/culebra.exe build wv.cul -o wv.exe; then
            out=$(./wv.exe 2>&1); rc=$?
            echo "out=[$out] rc=$rc"
            [ "$out" = "webview+http ok" ] && echo "AOT_WEBVIEW_HTTP_PASS" \
              || { echo "AOT_WEBVIEW_HTTP_RUN_FAIL"; exit 1; }
          else
            echo "AOT_WEBVIEW_HTTP_BUILD_FAIL rc=$?"
            exit 1
          fi
      # The step above proves the link; this one proves the request path. AOT
      # force-loads the Http archive's strong bodies over the core archive's
      # weak stubs, and those strong bodies are the ServerRequest/ServerResponse
      # adapter (http_server_route, http_res_set_status/content, ...) — code
      # this build has so far only linked, never run. listen_async avoids an
      # Isolate for a minimal script; the server answers on its own worker
      # while this thread's Http.get() drives the round trip.
      - name: Smoke — AOT Http server round trip
        env:
          CULEBRA_VERBOSE: "1"
        run: |
          cat > httpsrv.cul <<'EOF'
          let srv = Http.server()
          srv.get("/ping", fn (req) { "pong" })
          let port = srv.listen_async(0)
          let r = Http.get("http://127.0.0.1:" + port.to_string() + "/ping")
          srv.stop()
          if r.ok && r.status == 200 && r.body == "pong" {
            print("http server roundtrip ok")
          } else {
            print("http server roundtrip FAIL: " + r.status.to_string() + " " + r.body)
          }
          EOF
          if ./build-win-aot/culebra.exe build httpsrv.cul -o httpsrv.exe; then
            out=$(./httpsrv.exe 2>&1); rc=$?
            echo "out=[$out] rc=$rc"
            [ "$out" = "http server roundtrip ok" ] && echo "AOT_HTTP_ROUNDTRIP_PASS" \
              || { echo "AOT_HTTP_ROUNDTRIP_RUN_FAIL"; exit 1; }
          else
            echo "AOT_HTTP_ROUNDTRIP_BUILD_FAIL rc=$?"
            exit 1
          fi
          # triv.exe (no Http) vs httpsrv.exe (Http) isolates what OpenSSL now
          # costs only Http users, on the platform win_static used to charge it
          # to everyone. No "before" binary to diff against (this build already
          # has the fix), but the delta here is what the old unconditional link
          # would have added to triv.exe. triv.exe is built by the trivial-AOT
          # step above, which fails the job if it doesn't produce one.
          test -f triv.exe || { echo "triv.exe missing (trivial-AOT step didn't run?)"; exit 1; }
          echo "=== binary size: non-Http vs Http (Windows AOT) ==="
          ls -la triv.exe httpsrv.exe
      # tests/test_http.cul and tests/test_http_server.cul are the http.h
      # conformance suite `just test` runs on Linux/macOS; the round trip
      # above only proves one request/response, not routing/errors/the
      # Isolate-hosted server lifecycle. This is the only Windows config
      # with Http ON in a real build, so it's the one place to close that
      # gap. Oracle is vm-vs-JIT output equality (same as `just test`),
      # not a golden string — test_http_server prints too much for that.
      # AOT isn't compared here: it would need its own golden copy, not
      # evidence it's expected to diverge.
      - name: Test — Http conformance (vm vs JIT diff)
        run: |
          set +e  # msys2 bash runs with -e; see run_all_backends.sh's comment
          fail=0
          for f in tests/test_http.cul tests/test_http_server.cul; do
            name=$(basename "$f" .cul)
            echo "=== $f ==="
            out_vm=$(timeout 60 ./build-win-aot/culebra.exe --vm "$f" 2>&1)
            rc_vm=$?
            out_jit=$(timeout 60 ./build-win-aot/culebra.exe --jit "$f" 2>&1)
            rc_jit=$?
            if [ $rc_vm -ne 0 ]; then
              echo "${name}_VM_FAIL rc=$rc_vm"; echo "$out_vm"; fail=1; continue
            fi
            if [ $rc_jit -ne 0 ]; then
              echo "${name}_JIT_FAIL rc=$rc_jit"; echo "$out_jit"; fail=1; continue
            fi
            if [ "$out_vm" = "$out_jit" ]; then
              echo "${name}_PASS"
            else
              echo "${name}_DIVERGE"
              diff <(printf '%s' "$out_vm") <(printf '%s' "$out_jit")
              fail=1
            fi
          done
          exit $fail
      # The step above proves the link; this one proves the window.
      - name: Smoke — Webview window + event loop (vm / JIT)
        run: misc/aot_axes/probe_webview_window.sh ./build-win-aot/culebra.exe
      # AOT regression smoke: string concat + caught-value integrity (16-byte
      # runtime helpers, sret ABI), classes, getters and callable class objects.
      # set +e so every case still runs and gets listed, but any failure is
      # carried into the step's exit code — as informative-only this step stayed
      # green through a total AOT link break (missing -lws2_32).
      - name: Smoke — AOT (regression)
        run: |
          set +e
          fail=0
          run() {  # $1=label $2=source $3=expected
            printf '%s' "$2" > p.cul
            echo "=== $1 ==="
            if ./build-win-aot/culebra.exe build p.cul -o p.exe; then
              out=$(./p.exe 2>&1); rc=$?
              echo "out=[$out] rc=$rc"
              [ "$out" = "$3" ] && echo "${1}_PASS" \
                || { echo "${1}_FAIL"; fail=1; }
            else
              echo "${1}_BUILD_FAIL rc=$?"
              fail=1
            fi
          }
          run AOT_STRCAT 'print("a" + "b")' 'ab'
          run AOT_STRVAR 'let s = "hi"
          print(s + "!")' 'hi!'
          run AOT_NUMSTR 'print(42.to_string())' '42'
          run AOT_CATCHVAL 'try { throw "x" } catch e { print(e) }' 'x'
          run AOT_CATCHCAT 'try { throw "x" } catch e { print("got: " + e) }' 'got: x'
          run AOT_CLASS 'class P { new(x) { self.x = x }
          val() { return self.x + 1 } }
          print(P.new(7).val())' '8'
          run AOT_GETTER 'class P { new(x) { self.x = x }
          get val() { return self.x + 1 } }
          print(P.new(7).val)' '8'
          run AOT_CLASSCALL 'class P { new(x) { self.x = x }
          v() { return self.x } }
          print(P(9).v())' '9'
          # Full EH (defer + catch + concat), the original failing case.
          cat > aot_eh.cul <<'EOF'
          fn boom() { throw "kaboom" }
          fn worker() { defer { print("deferred ran") }; boom() }
          try { worker() } catch e { print("caught: " + e) }
          print("done")
          EOF
          echo "=== AOT_EH_FULL ==="
          if ./build-win-aot/culebra.exe build aot_eh.cul -o aot_eh.exe; then
            ./aot_eh.exe 2>&1 && echo "AOT_EH_FULL_done rc=$?" \
              || { echo "AOT_EH_FULL_RUN_FAIL rc=$?"; fail=1; }
          else
            echo "AOT_EH_FULL_BUILD_FAIL rc=$?"
            fail=1
          fi
          exit $fail
      - name: Verify the JIT's helpers are all in the export table
        run: tools/checks/check_jit_host_symbols.sh build-win-aot/culebra.exe
      # Last, so a link-level complaint doesn't hide the functional results
      # above. The window backend adds Win32 libraries to the link, so an
      # import it newly pulls in fails here, in a CI run, not during a release.
      - name: Verify standalone binary (only system DLLs)
        run: misc/windows_toolchain/verify_standalone_exe.sh build-win-aot/culebra.exe
      # The binary a downloader gets must carry its own linker, or every
      # `culebra toolchain install` below is pointless: the kit holds libraries
      # only. A build whose LLVM install lacked the lld archives configures and
      # links perfectly well, and silently falls back to needing clang++ on
      # PATH — so the property is checked, not assumed.
      - name: Verify lld is linked into this build
        run: misc/windows_toolchain/verify_inprocess_lld.sh build-win-aot/culebra.exe --size

      # --- the AOT toolchain kit, end to end -------------------------------
      #
      # `culebra build` on Windows links through the lld inside culebra.exe, but
      # the mingw CRT objects and static libraries still have to come from
      # somewhere, and a downloader has none. misc/windows_toolchain/pack_windows_toolchain.sh
      # packs them and `culebra toolchain install` puts them where a link looks
      # — the flow a user actually walks, which nothing else in CI touches.
      #
      # These steps also keep the packing script out of release-only territory
      # (tools/checks/check_release_covered_by_ci.sh): release.yml runs the same
      # script, and both releases this project has broken were broken by a
      # command a tag was the first to execute.
      #
      # In this job rather than one of its own: the kit's whole compatibility
      # claim is that it comes from the same MSYS2 tree that compiled the
      # embedded runtime archives, which here is true by construction rather
      # than by a second `setup-msys2` that has to be kept in step. It also
      # drops a runner boot, a checkout, a full pacman update and a round trip
      # through the artifact this job itself uploads.
      #
      # The round trip below is where the in-process linker actually links: the
      # steps above have MSYS2 on PATH and no kit, so their AOT smokes go
      # through the external driver — deliberately, since that is a
      # contributor's arrangement and it has to keep working. The two paths
      # differ in exactly one thing, which library set reaches the linker, so
      # the coverage that matters is link surface rather than program variety:
      # the axes swept are every distinct set of libraries `culebra build` can
      # ask for on Windows. What the codegen produces is the same object either
      # way, and the smokes above cover that.
      #
      # Version anchored at ^#define, the way the justfile and
      # playground/build.sh read it: the comment above that line spells the
      # macro too, as `X.Y.Z`, and an unanchored match takes both — which is
      # the version this kit's manifest claimed the first time round.
      - name: Pack the kit
        run: |
          version=$(sed -n 's/^#define CULEBRA_VERSION "\([^"]*\)"/\1/p' include/culebra.h)
          [ -n "$version" ] || { echo "no CULEBRA_VERSION in include/culebra.h" >&2; exit 1; }
          misc/windows_toolchain/pack_windows_toolchain.sh kit "$version" build-win-aot/culebra.exe
      # Everything below runs with a PATH built from scratch. A GitHub runner
      # is not a bare Windows box — the image ships a mingw64 at C:\mingw64 and
      # this job installed an MSYS2 — so inheriting PATH would prove nothing.
      # System32 for tar.exe (the extractor) and the CRT; nothing else.
      - name: Round trip — install, build every axis, uninstall
        shell: pwsh
        run: |
          $env:Path = "C:\Windows\System32;C:\Windows"
          $exe = (Resolve-Path build-win-aot\culebra.exe).Path
          $kit = (Get-ChildItem -Recurse -Filter '*.zip' kit)[0].FullName
          foreach ($t in 'clang++','ld.lld','g++','cc') {
            if (Get-Command $t -ErrorAction SilentlyContinue) { throw "$t is on PATH" }
          }

          # Nothing installed yet: the build must refuse, and say what to do.
          $out = & $exe build misc\windows_toolchain\linkkit\hello.cul -o hello.exe 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "build succeeded with no kit installed" }
          if ($out -notmatch 'culebra toolchain install') {
            throw "the failure does not name the fix:`n$out"
          }
          # No backticks around the command name: PowerShell reads a backtick as
          # its escape character, and a pair of them inside a double-quoted
          # string swallows the closing quote and breaks the parse fifteen lines
          # further down.
          "OK: refused without a kit, and it named the install command"

          # Positive control for the digest check, which is the same code the
          # network install runs: flip a byte and the install must refuse. A
          # verification that never says no is not a verification.
          Copy-Item $kit tampered.zip
          Copy-Item "$kit.sha256" tampered.zip.sha256
          $b = [IO.File]::ReadAllBytes("tampered.zip")
          $b[$b.Length - 1] = $b[$b.Length - 1] -bxor 0xFF
          [IO.File]::WriteAllBytes("$pwd\tampered.zip", $b)
          $out = & $exe toolchain install --from "$pwd\tampered.zip" 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "a tampered kit installed:`n$out" }
          if ($out -notmatch 'does not match its digest') {
            throw "refused, but not for the digest:`n$out"
          }
          "OK: a tampered kit is refused by its digest"

          & $exe toolchain install --from $kit
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          & $exe toolchain status
          if ($LASTEXITCODE -ne 0) { throw "status says the link is not ready" }

          # A reinstall that goes wrong must not take away the kit that was
          # working. Feeding install an archive that is not a kit is the
          # cheapest way to reach that path.
          "not a zip" | Out-File -Encoding ascii junk.zip
          & $exe toolchain install --from "$pwd\junk.zip" 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "a non-kit archive installed" }
          & $exe toolchain status
          if ($LASTEXITCODE -ne 0) { throw "a failed reinstall removed the kit" }
          "OK: a failed reinstall leaves the installed kit alone"

          # Leaves each axis's <name>.exe in the cwd; hello.exe is the one the
          # uninstall check below runs.
          & (Join-Path $pwd 'misc\windows_toolchain\linkkit\build_axes.ps1') $exe

          # A produced binary must need nothing from the kit: it is build-time
          # only, and this is where that stops being an assumption.
          & $exe toolchain uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          $out = (& .\hello.exe | Out-String).Trim()
          if ($out -ne 'hello from AOT') { throw "the binary needed the kit: '$out'" }
          & $exe build misc\windows_toolchain\linkkit\hello.cul -o again.exe 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "build still works after uninstall" }
          "OK: uninstall is complete, and what was built keeps running"
          exit 0

  # The Windows half of linux-scene, and the reason Scene's link fragment
  # carries --allow-multiple-definition: PE has no weak external, so the
  # `culebra_runtime_*` helpers the Scene archive leaves un-inlined meet the
  # core archive's strong ones and the AOT link fails without it. That failure
  # is invisible on ELF and Mach-O, so this lane is the only thing that can
  # report it — Scene had never been linked on Windows at all before it.
  #
  # No render step: a runner has no desktop, and unlike Canvas there is no
  # headless mode to fall back to, so View.new would legitimately raise. The
  # probe names Scene under `if false` — the AOT scan still force-loads the
  # archive, which is the axis under test.
  windows-scene:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The windows-aot-build set: the release configuration's clang + lld, the
      # gcc whose libstdc++ they use, and git for the deps cache key.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            git

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-scene-ccache-${{ github.sha }}
          restore-keys: |
            windows-scene-ccache-

      # windows-aot-build's key, for linux-scene's reason: same platform, same
      # submodules, same tree — whichever lane runs first pays for it.
      - name: Resolve deps cache key
        id: deps
        run: echo "key=$(misc/deps_cache_key.sh windows-deps)" >> "$GITHUB_OUTPUT"

      - name: Restore SDL3 + raylib deps cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: ${{ steps.deps.outputs.key }}

      # The download's own configure script plus the one option that is this
      # job's subject, so the toolchain and link flags cannot drift from the
      # configuration the duplicate-symbol problem actually appears in.
      - name: Configure (the Windows download's configuration, Scene ON)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CULEBRA_DEPS_CACHE: ${{ github.workspace }}/.deps
        run: misc/windows_toolchain/configure_windows_release.sh build-win-scene -DCULEBRA_ENABLE_SCENE=ON

      - name: Build (culebra driver + runtime archives)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        # `--target culebra` and `-k 0` as in windows-aot-build: the POSIX-only
        # test targets do not build here, and a clang lane should list every TU
        # it rejects rather than the first.
        run: cmake --build build-win-scene --target culebra -j -- -k 0
      - name: Report ccache stats
        run: ccache -s || true

      - name: Verify Scene is actually in this build
        run: misc/aot_axes/verify_scene_axis.sh build-win-scene

      # The whole point of the lane.
      - name: Smoke — AOT link with Scene force-loaded
        env:
          CULEBRA_VERBOSE: "1"
        run: misc/aot_axes/probe_scene_aot_link.sh ./build-win-scene/culebra.exe

  # Regression for issue #13: Arch's `llvm` package ships only the combined
  # libLLVM.so (no per-component .a archives), which the plain
  # `llvm_map_components_to_libnames()` -lLLVMCore/-lLLVMSupport/... list
  # can't link against. CMakeLists.txt falls back to the shared `LLVM`
  # imported target when the static archives are missing; this job proves
  # that path on a real Arch userland instead of just simulating it with
  # -DCULEBRA_LLVM_SHARED=ON on another distro. DEV_NO_RT + the other
  # features OFF keep it a narrow, fast check of the link step alone —
  # not a full-feature Arch gate.
  arch-jit-build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install toolchain (pacman)
        run: pacman -Syu --noconfirm git cmake ninja llvm ccache

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Toolchain versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          llvm-config --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: arch-jit-ccache-${{ github.sha }}
          restore-keys: |
            arch-jit-ccache-

      # Fails loudly (not just an informative smoke) if the shared-libLLVM
      # fallback didn't engage: that would mean Arch started shipping
      # per-component static libs again and this job stopped exercising
      # the issue #13 path, silently.
      - name: Configure (JIT ON, Arch's shared-only libLLVM, no AOT runtime)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build-arch-jit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCULEBRA_ENABLE_JIT=ON \
            -DCULEBRA_ENABLE_HTTP=OFF \
            -DCULEBRA_ENABLE_WEBVIEW=OFF \
            -DCULEBRA_DEV_NO_RT=ON \
            -DCULEBRA_LTO=OFF \
            | tee configure.log
          grep -q "Linking against the shared libLLVM" configure.log || {
            echo "::error::Arch's llvm package now ships per-component static libs — this job no longer exercises the issue #13 shared-libLLVM fallback. Update or drop arch-jit-build."
            exit 1
          }

      - name: Build (culebra driver, JIT enabled)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build-arch-jit --target culebra -j

      - name: Report ccache stats
        run: ccache -s || true

      - name: Smoke — JIT + interp (regression)
        run: |
          fail=0
          run() {  # $1=label $2=source $3=expected
            printf '%s' "$2" > p.cul
            for flag in "--vm" "--jit"; do
              out=$(./build-arch-jit/culebra $flag p.cul 2>&1); rc=$?
              if [ "$out" = "$3" ]; then
                echo "${1}_${flag#--}_PASS"
              else
                echo "${1}_${flag#--}_FAIL out=[$out] rc=$rc"
                fail=1
              fi
            done
          }
          run PRINT_STR 'print("hi")' 'hi'
          run ARITH 'print(20 + 22)' '42'
          run CATCHVAL 'try { throw "x" } catch e { print(e) }' 'x'
          exit $fail
