name: Release

# Pushing a `v*` tag builds the downloadable binaries and attaches them to the
# release for that tag. The release notes are NOT written here — `/release`
# (.claude/commands/release.md) authors them and flips the release out of draft
# once this workflow is green. This workflow only ever adds assets, so the two
# can run in either order.
on:
  push:
    tags: ['v*']
  # Re-run the asset build for an existing tag without re-tagging (a runner
  # flake, a fixed workflow bug). Uploads are --clobber, so this is idempotent.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build assets for (e.g. v0.1.0)'
        required: true

# One asset build per tag: a re-dispatch while a run is still going would have
# both racing to upload the same filenames.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write  # gh release create / upload

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Note there is deliberately no CULEBRA_CANVAS_WINDOW_DEFAULT here, unlike
  # ci.yml which pins it OFF for the jobs that do not want it. Each platform
  # gets CMake's own default, which is ON everywhere now — so every download
  # opens a real window for a Canvas game, matching what a local `just build`
  # produces. The Linux job therefore has to install SDL3's build dependencies
  # (it does, in its toolchain step); without them SDL3's configure fails and
  # takes the whole build with it. Windows needs no such packages, and its link
  # is proved by ci.yml's windows-aot-build.

jobs:
  # Make sure a release object exists before the build jobs try to upload into
  # it. Idempotent on purpose: `/release` may have created the draft already,
  # and a workflow_dispatch re-run finds a published release.
  prepare:
    runs-on: ubuntu-latest
    steps:
      # No checkout: this job only talks to the releases API, so `gh` is pointed
      # at the repo by GH_REPO rather than by a git remote.
      - name: Ensure a release exists for ${{ env.TAG }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `gh release create` would happily invent the tag at the default
          # branch, so a mistyped workflow_dispatch input must not reach it.
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null || {
            echo "no such tag: $TAG" >&2
            exit 1
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving its notes alone"
          else
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Assets are building. Release notes follow."
          fi

  macos-arm64:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The 7 GB runner swaps compiling >2 LLVM-header-heavy TUs (~3 GB each).
      CULEBRA_BUILD_JOBS: "2"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: brew install llvm just ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: release-macos-ccache-${{ github.sha }}
          # Fall back to the cache ci.yml keeps warm on master. A tag ref can
          # read the default branch's caches but not another tag's, so without
          # this second key every release would be a cold build — the release-*
          # entries this run writes are unreadable from the next tag. Same
          # `just build` flags and same env here, so most objects hit.
          restore-keys: |
            release-macos-ccache-
            ${{ runner.os }}-ccache-
      # `just build` is the -O3 + LTO configuration, unlike the no-LTO gate
      # build: a downloaded binary should be the fast one. It also builds the
      # vendored raylib + SDL3 statics here, which is why this job takes a few
      # minutes longer than ci.yml's.
      - run: just build
      - run: ccache -s || true
      - name: Verify the Canvas window backend is in this build
        run: misc/verify_canvas_window.sh build
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Assign first, upload second: a failing package step then aborts here
        # with its own message, instead of `gh` complaining about no files.
        run: |
          assets=$(misc/package_release.sh ./build/culebra "$TAG" macos arm64)
          gh release upload "$TAG" --clobber $assets

  linux-x64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Mirrors ci.yml's Ubuntu setup — gcc-14 for C++23 <print>, LLVM 22 for
      # the JIT's APIs, mold for the LLVM-heavy static link, `just` from its own
      # installer (apt's predates [group(...)]).
      #
      # gtk4 + webkitgtk-6.0 are installed here for their headers alone: the
      # binding defines every GTK/WebKit symbol it reaches and dlopens the
      # engine when a window is created (src/runtime/webview_gtk_dynload.cc), so
      # this download carries Webview and still starts where no desktop stack
      # exists — a headless server, a container, a desktop that never installed
      # webkitgtk-6.0. It used to be built with Webview off for exactly the
      # opposite reason: linking them put libgtk-4.so.1 and libwebkitgtk-6.0.so.4
      # in DT_NEEDED and the binary would not start at all. The ldd check below
      # is what keeps that from coming back.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake g++-14 libblas-dev mold wget \
            lsb-release software-properties-common gnupg \
            libgtk-4-dev libwebkitgtk-6.0-dev
          # SDL3's Linux build dependencies, so the Canvas desktop window is in
          # this download the way it is in a local `just build`. These are
          # build-time only: SDL3 dlopens X11/GL/audio on first use, so the
          # binary gains no DT_NEEDED entry and still runs on a headless server.
          # SDL3's configure hard-errors on a missing one rather than dropping
          # the backend, so this list tracks vendor/SDL/docs/README-linux.md.
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
            echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-22"
          } >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: release-linux-ccache-${{ github.sha }}
          restore-keys: |
            release-linux-ccache-
            ${{ runner.os }}-ccache-
      - run: just build -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
      - run: ccache -s || true
      - name: Verify the Canvas window backend is in this build
        run: misc/verify_canvas_window.sh build
      # A download that ships Webview must actually have it, for the same reason
      # the Canvas window is checked above: a missing dev package turns the axis
      # off and the build succeeds anyway.
      - name: Verify the Webview axis is in this build
        run: misc/verify_webview_axis.sh build

      # The asset's load-time contract, checked on the artifact itself: nothing
      # a desktop provides may appear in DT_NEEDED, or this download needs a
      # display just to print its --version. Both windowed stacks are meant to
      # arrive through dlopen — SDL3 does it for X11/GL/audio, and Webview for
      # GTK/WebKit.
      #
      # The engine half is the test gate's own ratchet, run here against the
      # artifact: one definition of "the engine stays behind dlopen", covering
      # the dynamic symbol table and a `culebra build` output as well as this
      # binary's DT_NEEDED. The display half has no such script — SDL3's stack
      # is named here, where naming it keeps the check from firing on unrelated
      # legitimate deps.
      - name: Verify no desktop runtime crept into the link
        run: |
          tools/check_webview_dynload.sh build
          deps=$(ldd build/culebra)
          echo "Shared library dependencies:"
          echo "$deps"
          if echo "$deps" | grep -iE 'libX11|libGL|libEGL|libwayland|libSDL|libasound|libpulse'; then
            echo "ERROR: the binary needs a display/audio stack to start" >&2
            exit 1
          fi
          echo "OK: no display runtime dependency"
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(misc/package_release.sh ./build/culebra "$TAG" linux x64)
          gh release upload "$TAG" --clobber $assets

  windows-x64:
    needs: prepare
    runs-on: windows-latest
    # The LTO link alone runs ~40 min here; the vendored SDL3 + raylib build
    # adds a few more on a cold deps cache.
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # mingw-w64, not MSVC: the Value type is used through std::vector<Value>
      # while incomplete, which libstdc++ accepts and the MSVC STL rejects
      # (see ci.yml's windows jobs). UCRT64 rather than MINGW64 — same gcc and
      # libstdc++, but the modern C runtime; see ci.yml's `windows` job. git is
      # in the list because the SDL3 + raylib deps cache is keyed on the
      # submodule revisions and setup-msys2's PATH has no git to read them with.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-webview2-loader
            zip
            git
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: release-windows-ucrt-ccache-${{ github.sha }}
          # windows-aot-ucrt-ccache-* is the closest warm cache: same configure line
          # apart from LTO, which only changes the `culebra` target's own two
          # TUs — the runtime archives that dominate the build still hit.
          restore-keys: |
            release-windows-ucrt-ccache-
            windows-aot-ucrt-ccache-
      # SDL3 + raylib, on the same key ci.yml's windows-aot-build publishes
      # under — a warm cache skips their ~4 min ExternalProject build.
      - name: Resolve deps cache key
        id: deps
        run: echo "key=$(misc/deps_cache_key.sh windows-deps)" >> "$GITHUB_OUTPUT"
      - name: Restore SDL3 + raylib deps cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: ${{ steps.deps.outputs.key }}
      # The feature set of ci.yml's windows-aot-build (the widest Windows
      # configuration that CI proves), with LTO turned back on for release.
      # Http and Webview are on here. WebView2 costs this binary nothing a plain
      # Windows box lacks: the engine is the Edge runtime, found at run time, so
      # the only new imports are system DLLs (ole32, shlwapi, version). The
      # Linux asset now reaches the same place by dlopening GTK/WebKit rather
      # than linking them (webview_gtk_dynload.cc). Note the standalone
      # check below scans the import table, which the engine is deliberately
      # outside of — it proves no stray DLL, not that WebView2 is reachable.
      # The Canvas window is left to CMake's default (ON), like the macOS and
      # Linux jobs — spelling it out would make the verification below
      # unfalsifiable.
      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CULEBRA_DEPS_CACHE: ${{ github.workspace }}/.deps
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCULEBRA_ENABLE_JIT=ON \
            -DCULEBRA_ENABLE_HTTP=ON \
            -DCULEBRA_ENABLE_WEBVIEW=ON \
            -DCULEBRA_DEV_NO_RT=OFF \
            -DCULEBRA_LTO=ON
      # Before the build, not after: unlike the macOS and Linux jobs (whose
      # `just build` is one step) this one can catch a lost window backend
      # without first paying the ~40 min LTO link.
      - name: Verify the Canvas window backend is in this build
        run: misc/verify_canvas_window.sh build
      # Only `culebra` (+ its embedded runtime archives): the default `all`
      # pulls in POSIX-only test targets.
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build --target culebra -j
      - run: ccache -s || true
      # The whole point of -static here: a downloaded .exe must not need a DLL
      # the user does not have. Same script — and so the same allowlist — as
      # ci.yml's two Windows link checks, so this gate cannot end up weaker.
      - name: Verify standalone binary (only system DLLs)
        run: misc/verify_standalone_exe.sh build/culebra.exe
      # Both features self-disable in CMake when their headers are missing, and
      # a disabled Webview *shrinks* the import set, so the check above passes
      # and the asset ships without it. The archive exists only if the binding
      # compiled. (CMakeCache is no proof: the option stays ON there while the
      # feature block turns it off in a normal variable.)
      - name: Verify Webview and Http are in the asset
        run: |
          test -f build/libculebra_rt_webview.a \
            || { echo "ERROR: Webview silently disabled (WebView2.h not found?)"; exit 1; }
          printf 'let srv = Http.server()\nprint("http ok")\n' > http.cul
          ./build/culebra.exe http.cul | grep -qx 'http ok' \
            || { echo "ERROR: Http silently disabled"; exit 1; }
          echo "OK: Webview and Http are built into this asset"
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # setup-msys2 defaults to path-type `minimal`, whose PATH holds only
          # the MSYS2 trees plus System32 — the runner's gh.exe lives outside
          # both, so `gh` would be not-found here, at the end of a ~40 min
          # build. `inherit` puts the Windows PATH back. GH_REPO matters for the
          # same reason: MSYS2 has no git for gh to read the remote from.
          MSYS2_PATH_TYPE: inherit
        run: |
          assets=$(misc/package_release.sh ./build/culebra.exe "$TAG" windows x64)
          gh release upload "$TAG" --clobber $assets

  # One file the user can `sha256sum -c` against every asset at once. Reads the
  # per-asset digests back off the release rather than passing artifacts around,
  # which also proves each upload actually landed.
  finalize:
    needs: [macos-arm64, linux-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern '*.sha256' --dir sums
          cat sums/*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      # Publishing stays with `/release`, which owns the notes: assets being
      # ready is not the same as the release being ready to announce.
      - name: Remind that the release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            echo "Assets are complete. \`/release\` publishes $TAG once the notes are in." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
