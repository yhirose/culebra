<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>culebra desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>It works 🛸</h1>
    <p class="msg" id="msg">contacting local server...</p>
    <div class="row">
      <input id="text" placeholder="type something" value="hello server">
      <button id="send">Send</button>
    </div>
    <p class="reply" id="reply"></p>
    <button id="quit">Quit</button>
  </main>
  <div class="confirm-overlay" id="confirmOverlay" hidden>
    <div class="confirm-box">
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="secondary">Cancel</button>
        <button id="confirmOk">OK</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
