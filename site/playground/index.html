<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything this page loads, and nothing else: no script, style or font
       from anywhere but here, the libraries included (vendor.sh).
       'wasm-unsafe-eval' is what lets the engine instantiate; 'unsafe-inline'
       in style-src is CodeMirror, which injects its theme as a <style> element
       at runtime. No inline script: boot.js is a file for that reason.
       connect-src stays open to https because ?src= takes a file from any
       host. frame-ancestors and report-only are header-only and so out of
       reach on GitHub Pages. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self' https:;
    worker-src 'self' blob:;
    base-uri 'none';
    form-action 'none'">
  <title>culebra Playground v0.5.0</title>
  <meta name="description" content="Run culebra in your browser — the interpreter compiled to WebAssembly.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./vendor/xterm.css">
  <script src="./boot.js"></script>
</head>
<body>
  <header class="pg-header">
    <div class="brand">
      <a class="wordmark" href="../" aria-label="culebra home">
        <svg class="mark" width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M13 15C13 12 13.5 9 14 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M14 6C15 2 18 1 19 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M14 6C16.2 5.4 18.5 6 19 8.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M14 6C13 2 10 1 9 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M14 6C11.8 5.4 9.5 6 9 8.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M2 15.5c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M2 20c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
        </svg>
        culebra
      </a>
      <span class="sub">Playground v0.5.0</span>
    </div>
    <nav>
      <a href="https://github.com/yhirose/culebra/tree/master/docs">Docs</a>
      <a href="https://github.com/yhirose/culebra">Repository</a>
    </nav>
  </header>

  <div class="pg-toolbar">
    <button id="run" class="btn btn-primary" disabled>Run</button>
    <button id="stop" class="btn" disabled>Stop</button>
    <select id="example-category" class="example-select" aria-label="Example category">
      <option value="">Examples…</option>
    </select>
    <select id="example-item" class="example-select" aria-label="Load an example" disabled>
      <option value="">…</option>
    </select>
    <input id="args" type="text" spellcheck="false" autocomplete="off"
           placeholder="arguments → Sys.argv" aria-label="Command-line arguments">
    <button id="new" class="btn" title="Start an empty program">New</button>
    <div class="pg-share">
      <button id="share" class="btn" title="Copy a link to this source"
              aria-haspopup="true" aria-expanded="false">Share</button>
      <div id="share-menu" class="pg-share-menu" role="dialog" aria-label="Share a link" hidden>
        <div class="pg-share-row" role="radiogroup" aria-label="Embed">
          <span class="pg-share-label">Embed</span>
          <div class="pg-share-tiles">
            <label><input type="radio" name="share-embed" value="" checked><span>Off</span></label>
            <label><input type="radio" name="share-embed" value="editor"><span>Editor</span></label>
            <label><input type="radio" name="share-embed" value="output"><span>Output</span></label>
          </div>
        </div>
        <div class="pg-share-row" role="radiogroup" aria-label="View">
          <span class="pg-share-label">View</span>
          <div class="pg-share-tiles">
            <label><input type="radio" name="share-view" value="output" checked><span>Output</span></label>
            <label><input type="radio" name="share-view" value="tui"><span>TUI</span></label>
            <label><input type="radio" name="share-view" value="canvas"><span>Canvas</span></label>
          </div>
        </div>
        <div class="pg-share-row" role="radiogroup" aria-label="Split">
          <span class="pg-share-label">Split</span>
          <div class="pg-share-tiles">
            <label><input type="radio" name="share-split" value="" checked><span>Beside</span></label>
            <label><input type="radio" name="share-split" value="top"><span>Below</span></label>
          </div>
        </div>
        <div class="pg-share-row" role="radiogroup" aria-label="On open">
          <span class="pg-share-label">On open</span>
          <div class="pg-share-tiles">
            <label><input type="radio" name="share-run" value="" checked><span>Wait</span></label>
            <label><input type="radio" name="share-run" value="1"><span>Run</span></label>
          </div>
        </div>
        <button id="share-copy" class="btn btn-primary">Copy link</button>
        <code id="share-url" class="pg-share-url"></code>
      </div>
    </div>
    <span class="spacer"></span>
    <span id="backend" class="backend"></span>
    <span id="status" class="status">loading…</span>
  </div>

  <main class="pg-main">
    <div id="editor" class="pg-editor"></div>
    <div class="pg-right">
      <div class="pg-tabs" role="tablist">
        <button id="tab-output" class="pg-tab active" data-pane="output" role="tab" aria-selected="true">Output</button>
        <button id="tab-tui" class="pg-tab" data-pane="tui" role="tab" aria-selected="false">TUI</button>
        <button id="tab-canvas" class="pg-tab" data-pane="canvas" role="tab" aria-selected="false">Canvas</button>
        <span class="spacer"></span>
        <button id="clear" class="pg-tab-action">Clear</button>
      </div>
      <div class="pg-panes">
        <pre id="output" class="pg-output pg-pane active"></pre>
        <div id="tui" class="pg-tui pg-pane"></div>
        <div id="canvas-pane" class="pg-canvas pg-pane" tabindex="0">
          <!-- #game is the framebuffer at its own low resolution, stretched by
               CSS with pixelated (nearest) sampling; #game-text is the screen
               layer over it at the size it is actually displayed at, so
               Font.draw_screen's antialiased edges are not magnified into
               blocks. The stack keeps them exactly co-extensive. -->
          <div id="canvas-stack" class="pg-canvas-stack">
            <canvas id="game" width="160" height="160"></canvas>
            <canvas id="game-text" class="pg-canvas-overlay"></canvas>
          </div>
        </div>
        <!-- Shown when the program is not running and the page is an
             output-only embed, where the toolbar's Run is not on screen.
             Covers the pane the way a video poster does: click anywhere. -->
        <button id="play" class="pg-play" hidden aria-label="Run this program">
          <span class="pg-play-glyph" aria-hidden="true">▷</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
