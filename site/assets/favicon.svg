<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 0.25 23 23">
  <!-- The nav wordmark's palm and waves. Standalone, so `currentColor` binds
       to the root `color` here instead of the page's. The viewBox is cropped
       to the ink: the nav's 26x26 leaves more room below the waves than above
       the fronds, which reads as top-aligned in a browser tab. -->
  <style>
    :root { color: #1590c4; }
    @media (prefers-color-scheme: dark) { :root { color: #45b8ee; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M13 15C13 12 13.5 9 14 6"/>
    <path d="M14 6C15 2 18 1 19 3"/>
    <path d="M14 6C16.2 5.4 18.5 6 19 8.8"/>
    <path d="M14 6C13 2 10 1 9 3"/>
    <path d="M14 6C11.8 5.4 9.5 6 9 8.8"/>
    <path d="M2 15.5c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"/>
    <!-- Heavier than the nav's 0.5: at 16px the stroke is 1.4px wide, and half
         opacity on top of that all but dissolves under antialiasing, leaving
         the mark looking top-heavy. -->
    <path d="M2 20c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0" opacity="0.7"/>
  </g>
</svg>
