<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>culebra Playground</title>
  <meta name="description" content="Run culebra in your browser — the interpreter compiled to WebAssembly.">
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="pg-header">
    <div class="brand">
      <a class="wordmark" href="../" aria-label="culebra home">
        <svg class="mark" width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <circle cx="17.2" cy="7.6" r="3.3" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M2 15.5c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M2 20c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
        </svg>
        culebra
      </a>
      <span class="sub">Playground</span>
    </div>
    <nav>
      <a href="https://github.com/yhirose/culebra/tree/master/docs">Docs</a>
      <a href="https://github.com/yhirose/culebra">Repository</a>
    </nav>
  </header>

  <div class="pg-toolbar">
    <button id="run" class="btn btn-primary" disabled>Run</button>
    <button id="stop" class="btn" disabled>Stop</button>
    <button id="clear" class="btn">Clear</button>
    <select id="examples" aria-label="Load an example">
      <option value="">Examples…</option>
    </select>
    <span class="hint">Ctrl/Cmd+Enter · runs entirely in your browser</span>
    <span class="spacer"></span>
    <span id="status" class="status">loading…</span>
  </div>

  <main class="pg-main">
    <textarea id="editor" class="pg-editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <pre id="output" class="pg-output"><span class="placeholder">Output appears here. Press Run.</span></pre>
  </main>

  <script>
    try {
      var t = localStorage.getItem("culebra-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
